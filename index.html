<!
  <div class="help">Bahçede dolaş • Yumurtaları topla • Çiftliği büyüt</div>
  <div class="actions">
    <button id="marketBtn">🛒 MARKET</button>
    <button id="breedBtn">❤️ ÇİFTLEŞTİR</button>
  </div>
  <div class="rounds">
    <button class="round" id="feedBtn"><span>🌾</span>YEM VER</button>
    <button class="round" id="collectBtn"><span>🥚</span>TOPLA</button>
  </div>
  <div id="joystick"><div id="stick"></div></div>
</div>

<div id="toast" class="toast"></div>

<div id="market" class="panel">
  <h2>🐔 Canlı Tavuk Pazarı</h2>
  <div class="grid" id="breedGrid"></div>
  <div class="card" style="margin-top:10px;">
    <h3>🌾 50 Yem Deposu</h3>
    <p>Çiftlik yem stoğunu artırır.</p>
    <button id="buyFeedBtn">25 ₺ Satın Al</button>
  </div>
  <button class="close" id="closeMarketBtn">MARKETİ KAPAT</button>
</div>

<script>
// --- Three.js Kurulumu ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Işıklandırma
const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
sunLight.position.set(25, 40, 25);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 100;
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
scene.add(sunLight);

// --- Topraklı Çim Doku Oluşturucu (Procedural Canvas Texture) ---
function generateDirtGrassTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  // Zemin Toprak Tabanı
  ctx.fillStyle = '#5c4033';
  ctx.fillRect(0, 0, 512, 512);

  // Toprak Desenleri
  for(let i=0; i<3000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? '#422c22' : '#6e4f3f';
    ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }

  // Çim Lekeleri
  for(let i=0; i<150; i++) {
    let cx = Math.random()*512, cy = Math.random()*512, rad = 8 + Math.random()*25;
    let grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, rad);
    grad.addColorStop(0, '#4e8d38');
    grad.addColorStop(0.7, '#386927');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(6, 6);
  return texture;
}

// Zemin
const groundMat = new THREE.MeshStandardMaterial({ map: generateDirtGrassTexture(), roughness: 0.9, metalness: 0.1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Çimen Çalıları Ekleyelim
function addGrassTufts() {
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x417d2d, side: THREE.DoubleSide });
  for(let i=0; i<120; i++) {
    const group = new THREE.Group();
    for(let b=0; b<4; b++) {
      const blade = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.6, 3), grassMat);
      blade.position.set((Math.random()-0.5)*0.3, 0.3, (Math.random()-0.5)*0.3);
      blade.rotation.z = (Math.random()-0.5)*0.4;
      group.add(blade);
    }
    group.position.set((Math.random()-0.5)*40, 0, (Math.random()-0.5)*40);
    scene.add(group);
  }
}
addGrassTufts();

// Ahşap Çitler
function createFences() {
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0x6e4726, roughness: 0.8 });
  [-22, 22].forEach(pos => {
    for(let i=-22; i<=22; i+=3) {
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4), fenceMat);
      p1.position.set(i, 0.7, pos); p1.castShadow = true; scene.add(p1);
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.4), fenceMat);
      p2.position.set(pos, 0.7, i); p2.castShadow = true; scene.add(p2);
    }
    const r1 = new THREE.Mesh(new THREE.BoxGeometry(44, 0.1, 0.15), fenceMat);
    r1.position.set(0, 1.1, pos); scene.add(r1);
    const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 44), fenceMat);
    r2.position.set(pos, 1.1, 0); scene.add(r2);
  });
}
createFences();

// Ahşap Kümes Detaylı
const coop = new THREE.Group();
const woodMat = new THREE.MeshStandardMaterial({ color: 0x7c4c23, roughness: 0.7 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b2500, roughness: 0.5 });
const coopWalls = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.8, 3.5), woodMat);
coopWalls.position.y = 1.4; coopWalls.castShadow = true; coopWalls.receiveShadow = true; coop.add(coopWalls);
const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 1.8, 4), roofMat);
roof.position.y = 3.6; roof.rotation.y = Math.PI / 4; roof.castShadow = true; coop.add(roof);
const door = new THREE.Mesh(new THREE.BoxGeometry(1, 1.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x3d2310 }));
door.position.set(0, 0.8, 1.76); coop.add(door);
coop.position.set(-10, 0, -10);
scene.add(coop);

// --- Organik Detaylı İnsan Karakteri ---
function createHuman() {
  const human = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0x2e5b88, roughness: 0.7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
  const hatMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });

  // Gövde
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 1.1, 8), shirtMat);
  torso.position.y = 1.15; torso.castShadow = true; human.add(torso);

  // Kafatası
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), skinMat);
  head.position.y = 1.88; head.castShadow = true; human.add(head);

  // Şapka
  const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.04, 12), hatMat);
  hatBrim.position.y = 2.02; human.add(hatBrim);
  const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.25, 0.25, 12), hatMat);
  hatTop.position.y = 2.15; human.add(hatTop);

  // Bacaklar
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.8, 8), pantsMat);
  legL.position.set(-0.14, 0.4, 0); legL.castShadow = true; human.add(legL);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.09, 0.8, 8), pantsMat);
  legR.position.set(0.14, 0.4, 0); legR.castShadow = true; human.add(legR);

  return { mesh: human, legL, legR };
}
const player = createHuman();
scene.add(player.mesh);

// --- Organik Tavuk ve Horoz Modeli ---
function createRealisticChicken(colorHex, isMale) {
  const group = new THREE.Group();
  const featherMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.8 });
  const redMat = new THREE.MeshStandardMaterial({ color: 0xcc1111, roughness: 0.5 });
  const beakMat = new THREE.MeshStandardMaterial({ color: 0xe69d00, roughness: 0.4 });
  const s = isMale ? 1.25 : 1.0;

  // Gövde (Yumurta formu)
  const bodyGeo = new THREE.SphereGeometry(0.35 * s, 12, 10);
  bodyGeo.scale(1, 0.9, 1.3);
  const body = new THREE.Mesh(bodyGeo, featherMat);
  body.position.y = 0.4 * s; body.castShadow = true; group.add(body);

  // Boyun ve Kafatası
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.18 * s, 0.35 * s, 8), featherMat);
  neck.position.set(0, 0.65 * s, 0.28 * s); neck.rotation.x = 0.3; neck.castShadow = true; group.add(neck);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14 * s, 10, 10), featherMat);
  head.position.set(0, 0.82 * s, 0.34 * s); group.add(head);

  // Gaga
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.05 * s, 0.12 * s, 4), beakMat);
  beak.position.set(0, 0.8 * s, 0.48 * s); beak.rotation.x = Math.PI / 2; group.add(beak);

  // İbik
  const combGeo = new THREE.BoxGeometry(0.04 * s, (isMale ? 0.22 : 0.12) * s, 0.22 * s);
  const comb = new THREE.Mesh(combGeo, redMat);
  comb.position.set(0, (isMale ? 0.98 : 0.92) * s, 0.34 * s); group.add(comb);

  // Kuyruk
  const tail = new THREE.Mesh(new THREE.ConeGeometry((isMale ? 0.25 : 0.15) * s, (isMale ? 0.6 : 0.35) * s, 5), featherMat);
  tail.position.set(0, (isMale ? 0.65 : 0.5) * s, -0.45 * s); tail.rotation.x = -Math.PI / 3; tail.castShadow = true; group.add(tail);

  // Bacaklar
  const legMat = new THREE.MeshStandardMaterial({ color: 0xd9a736 });
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.02 * s, 0.02 * s, 0.25 * s), legMat);
  legL.position.set(-0.1 * s, 0.12 * s, 0); group.add(legL);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.02 * s, 0.02 * s, 0.25 * s), legMat);
  legR.position.set(0.1 * s, 0.12 * s, 0); group.add(legR);

  return group;
}

// Oyun Durumu
let state = { money: 500, feed: 100, eggs: 0 };
const breeds = {
 'Lohman Brown': { sex: 'f', price: 90, color: 0xad5224, desc: 'Kahverengi yüksek yumurtacı.' },
 'Australorp': { sex: 'f', price: 120, color: 0x1f2421, desc: 'Siyah cins, yüksek verim.' },
 'Leghorn': { sex: 'f', price: 140, color: 0xf5f5f5, desc: 'Beyaz hafif tavuk.' },
 'Kızıl Horoz': { sex: 'm', price: 160, color: 0xc83200, desc: 'Sürü lideri kırmızı horoz.' }
};

let chickens = [];
let eggMeshes = [];

function spawnChicken(breedName) {
  const b = breeds[breedName];
  const mesh = createRealisticChicken(b.color, b.sex === 'm');
  const x = (Math.random() - 0.5) * 16;
  const z = (Math.random() - 0.5) * 16;
  mesh.position.set(x, 0, z);
  scene.add(mesh);

  chickens.push({
    mesh: mesh,
    sex: b.sex,
    breed: breedName,
    tx: x, tz: z,
    timer: Math.random() * 4,
    eggTimer: 18 + Math.random() * 10
  });
}

function spawnEggMesh(x, z) {
  const eggGeo = new THREE.SphereGeometry(0.12, 10, 10);
  eggGeo.scale(1, 1.3, 1);
  const eggMat = new THREE.MeshStandardMaterial({ color: 0xf5e6d3, roughness: 0.4 });
  const egg = new THREE.Mesh(eggGeo, eggMat);
  egg.position.set(x, 0.1, z); egg.rotation.z = Math.PI / 3; egg.castShadow = true;
  scene.add(egg);
  eggMeshes.push(egg);
}

// Başlangıç
spawnChicken('Lohman Brown');

// Arayüz
function updateUI() {
  document.getElementById('money').textContent = Math.floor(state.money);
  document.getElementById('feed').textContent = Math.floor(state.feed);
  document.getElementById('eggs').textContent = state.eggs;
  document.getElementById('fem').textContent = chickens.filter(c => c.sex === 'f').length;
  document.getElementById('male').textContent = chickens.filter(c => c.sex === 'm').length;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.style.display = 'none', 2000);
}

const grid = document.getElementById('breedGrid');
Object.entries(breeds).forEach(([name, b]) => {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h3>${b.sex === 'f' ? '🐔' : '🐓'} ${name}</h3><p>${b.desc}</p><button>${b.price} ₺ Satın Al</button>`;
  card.querySelector('button').onclick = () => {
    if (state.money >= b.price) {
      state.money -= b.price; spawnChicken(name); updateUI(); toast(name + ' alındı!');
    } else toast('Yetersiz bakiye!');
  };
  grid.appendChild(card);
});

document.getElementById('marketBtn').onclick = () => document.getElementById('market').style.display = 'block';
document.getElementById('closeMarketBtn').onclick = () => document.getElementById('market').style.display = 'none';
document.getElementById('buyFeedBtn').onclick = () => {
  if (state.money >= 25) { state.money -= 25; state.feed += 50; updateUI(); toast('50 Yem alındı!'); }
};
document.getElementById('feedBtn').onclick = () => {
  if (state.feed >= 10) { state.feed -= 10; updateUI(); toast('🌾 Bahçeye yem saçıldı'); }
};
document.getElementById('collectBtn').onclick = () => {
  if (state.eggs > 0) {
    const earned = state.eggs * 15; state.money += earned;
    toast(`🥚 ${state.eggs} Yumurta satıldı: +${earned} ₺`);
    state.eggs = 0;
    eggMeshes.forEach(e => scene.remove(e));
    eggMeshes = [];
    updateUI();
  } else toast('Bahçede yumurta yok!');
};
document.getElementById('breedBtn').onclick = () => {
  const fCount = chickens.filter(c => c.sex === 'f').length;
  const mCount = chickens.filter(c => c.sex === 'm').length;
  if (fCount > 0 && mCount > 0) {
    spawnChicken('Lohman Brown'); toast('❤️ Yeni bir civciv/tavuk doğdu!'); updateUI();
  } else toast('En az 1 Horoz ve 1 Dişi gerekiyor!');
};

document.getElementById('startBtn').onclick = () => {
  const overlay = document.getElementById('startOverlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 800);
  document.getElementById('hud').style.opacity = '1';
};

// Joystick
let joy = { x: 0, y: 0, active: false };
const js = document.getElementById('joystick'), st = document.getElementById('stick');

function handleMove(e) {
  const r = js.getBoundingClientRect();
  const x = e.clientX - r.left - 60, y = e.clientY - r.top - 60;
  const dist = Math.min(45, Math.hypot(x, y)), angle = Math.atan2(y, x);
  joy.x = (Math.cos(angle) * dist) / 45; joy.y = (Math.sin(angle) * dist) / 45;
  st.style.left = (35 + joy.x * 30) + 'px'; st.style.top = (35 + joy.y * 30) + 'px';
}

js.addEventListener('pointerdown', e => { joy.active = true; js.setPointerCapture(e.pointerId); handleMove(e); });
js.addEventListener('pointermove', e => { if (joy.active) handleMove(e); });
function endJoy() { joy.active = false; joy.x = 0; joy.y = 0; st.style.left = '33px'; st.style.top = '33px'; }
js.addEventListener('pointerup', endJoy); js.addEventListener('pointercancel', endJoy);

// Animasyon & Render Döngüsü
const clock = new THREE.Clock();
let animTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  animTime += dt * 8;

  // Oyuncu
  if (joy.active) {
    player.mesh.position.x += joy.x * 6 * dt;
    player.mesh.position.z += joy.y * 6 * dt;
    player.mesh.rotation.y = Math.atan2(-joy.x, -joy.y);

    // Yürüme Animasyonu
    player.legL.rotation.x = Math.sin(animTime) * 0.6;
    player.legR.rotation.x = -Math.sin(animTime) * 0.6;

    player.mesh.position.x = Math.max(-20, Math.min(20, player.mesh.position.x));
    player.mesh.position.z = Math.max(-20, Math.min(20, player.mesh.position.z));
  } else {
    player.legL.rotation.x = 0; player.legR.rotation.x = 0;
  }

  // Kamera
  camera.position.set(player.mesh.position.x, player.mesh.position.y + 9, player.mesh.position.z + 11);
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z);

  // Tavuklar
  chickens.forEach(c => {
    c.timer -= dt;
    if (c.timer <= 0) {
      c.tx = (Math.random() - 0.5) * 22;
      c.tz = (Math.random() - 0.5) * 22;
      c.timer = 3 + Math.random() * 5;
    }

    const dx = c.tx - c.mesh.position.x, dz = c.tz - c.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.3) {
      c.mesh.position.x += (dx / dist) * 1.3 * dt;
      c.mesh.position.z += (dz / dist) * 1.3 * dt;
      c.mesh.rotation.y = Math.atan2(dx, dz);
      c.mesh.position.y = Math.abs(Math.sin(animTime*1.2)) * 0.08; // Yürüme yaylanması
    }

    if (c.sex === 'f') {
      c.eggTimer -= dt;
      if (c.eggTimer <= 0) {
        c.eggTimer = 22 + Math.random() * 12;
        state.eggs++;
        spawnEggMesh(c.mesh.position.x, c.mesh.position.z);
        updateUI();
        toast('🥚 Çiftlikte taze bir yumurta belirdi!');
      }
    }
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateUI();
animate();
</script>
</body>
</html>
