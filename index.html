<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tavuk Çiftliği 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87c8f5}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:10}
.stat{background:#172331e8;color:#fff;padding:9px 12px;border-radius:13px;font-weight:800;box-shadow:0 3px 10px #0004}
#buttons{position:fixed;right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20}
button{border:0;border-radius:13px;padding:13px 16px;font-weight:900;font-size:15px;background:#2f7d46;color:white;box-shadow:0 4px 12px #0005}
button:active{transform:scale(.97)}
#joystick{position:fixed;left:18px;bottom:max(25px,env(safe-area-inset-bottom));width:125px;height:125px;border-radius:50%;background:#0003;border:2px solid #fff9;z-index:20;touch-action:none}
#stick{position:absolute;width:52px;height:52px;border-radius:50%;background:#fff;left:34px;top:34px;box-shadow:0 2px 8px #0006}
#panel{display:none;position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);max-height:82vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 18px 60px #0009;color:#172331}
#panel h2{margin:2px 0 12px}
.item{background:#eef6ef;border-radius:14px;padding:12px;margin:9px 0;min-height:76px}
.item button{float:right;margin-top:-28px}
#close{width:100%;background:#333;margin-top:8px}
#toast{display:none;position:fixed;z-index:70;top:90px;left:50%;transform:translateX(-50%);background:#172331ee;color:#fff;padding:10px 15px;border-radius:12px;font-weight:800}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:15;background:#172331b8;color:#fff;padding:7px 11px;border-radius:10px;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div class="stat">💰 <span id="money">500</span> ₺</div>
  <div class="stat">🐔 Dişi: <span id="fem">1</span></div>
  <div class="stat">🐓 Horoz: <span id="male">0</span></div>
  <div class="stat">🥚 Yumurta: <span id="eggs">0</span></div>
  <div class="stat">🌾 Yem: <span id="feed">100</span></div>
</div>

<div id="buttons">
  <button id="marketBtn">🛒 MARKET</button>
  <button id="breedBtn">❤️ ÇİFTLEŞTİR</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<div id="hint">Sol joystick ile çiftlikte dolaş</div>

<div id="panel">
  <h2>🐔 Tavuk Çiftliği Marketi</h2>
  <div class="item"><b>Dişi Tavuk</b><br>Sağlıklı yetişkin tavuk <button data-buy="female">80 ₺</button></div>
  <div class="item"><b>Horoz</b><br>Damızlık erkek tavuk <button data-buy="male">100 ₺</button></div>
  <div class="item"><b>50 Yem</b><br>Yem stoğunu artırır <button data-buy="feed">25 ₺</button></div>
  <button id="close">Kapat</button>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86c9f5);
scene.fog=new THREE.Fog(0x86c9f5,35,90);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140);
camera.position.set(9,7,11);

scene.add(new THREE.HemisphereLight(0xbfe8ff,0x6b4a2a,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3.0);
sun.position.set(-20,30,15); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
scene.add(sun);

const mat=(c,rough=1)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const grassMat=mat(0x58a83f), soilMat=mat(0x9a6a3e), woodMat=mat(0x7a4a25), roofMat=mat(0x8e3428), whiteMat=mat(0xf3efe3), darkMat=mat(0x333333);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grassMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Farmland patches
function box(x,y,z,sx,sy,sz,m,shadow=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o;
}
function cyl(x,y,z,r,h,m){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
box(0,.025,0,38,.05,7,soilMat,false);
for(let i=-16;i<=16;i+=4) box(i,.055,0,2.7,.03,6.6,mat(0x7f5734),false);

// Road
box(0,.04,13,60,.04,5.5,mat(0x8b877d),false);
for(let x=-28;x<28;x+=5) box(x,.07,13,2.8,.02,.12,mat(0xe9d37a),false);

// House
box(-11,1.5,-10,8,3,6,whiteMat);
const houseRoof=new THREE.Mesh(new THREE.ConeGeometry(5.7,3.2,4),roofMat);
houseRoof.rotation.y=Math.PI/4;houseRoof.position.set(-11,4.5,-10);houseRoof.castShadow=true;scene.add(houseRoof);
box(-11,1.1,-6.85,1.4,2.2,.18,darkMat);
for(const x of [-13,-9]) box(x,1.8,-6.85,1.2,1.1,.2,mat(0x78b9d6));

// Coop with open front
box(8,1.2,-7,7,2.4,5,woodMat);
const coopRoof=new THREE.Mesh(new THREE.ConeGeometry(4.8,2.8,4),roofMat);
coopRoof.rotation.y=Math.PI/4;coopRoof.position.set(8,3.9,-7);coopRoof.castShadow=true;scene.add(coopRoof);
box(8,.9,-4.35,2.5,1.8,.2,darkMat);
for(let x=5;x<=11;x+=2) box(x,.65,-4.45,.08,.9,.08,woodMat);

// Nest boxes + eggs
for(let x=6.3;x<=9.7;x+=1.7){
 box(x,.45,-5.0,.65,.45,.65,mat(0xb9864d));
}
let eggMeshes=[];
function makeEgg(pos){
 const e=new THREE.Mesh(new THREE.SphereGeometry(.16,.14,.14),whiteMat);
 e.scale.y=1.25;e.position.copy(pos);e.castShadow=true;scene.add(e);eggMeshes.push(e);
}
for(let i=0;i<Math.min(eggs,15);i++) makeEgg(new THREE.Vector3(6.1+(i%5)*.9,.65,-5.05-Math.floor(i/5)*.25));

// Fence
function fenceLine(x1,z1,x2,z2){
 const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),n=Math.floor(len/2.5);
 for(let i=0;i<=n;i++){const t=i/n;box(x1+dx*t,.65,z1+dz*t,.11,1.3,.11,woodMat)}
 box((x1+x2)/2,.45,(z1+z2)/2,len,.08,.08,woodMat);
}
fenceLine(-1,-8,14,-8);fenceLine(-1,3,14,3);fenceLine(-1,-8,-1,3);fenceLine(14,-8,14,3);

// Trees
function tree(x,z){
 cyl(x,1,z,.32,2,woodMat);
 const crown= new THREE.Mesh(new THREE.SphereGeometry(1.5,12,10),mat(0x2f7d32));
 crown.position.set(x,2.6,z);crown.castShadow=true;scene.add(crown);
 const c2=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),mat(0x3d923b));
 c2.position.set(x+.8,2.45,z+.2);c2.castShadow=true;scene.add(c2);
}
[[-18,-15],[-15,5],[-5,-15],[18,-14],[19,4],[-20,12],[20,12]].forEach(p=>tree(...p));

// Hay bales and water trough
for(let i=0;i<3;i++) cyl(-4+i*1.4,.55,-2,.55,1.0,mat(0xd6a83f));
box(11,.45,-1.8,2.4,.5,1.2,mat(0x4f89a0));

// Player
const player=new THREE.Group();
const body=box(0,0,0,0.8,1.35,.65,mat(0x2e65a8)); body.parent.remove(body); player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xd7a47c));head.position.y=.95;head.castShadow=true;player.add(head);
const hat=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.18,16),mat(0x26374b));hat.position.y=1.25;hat.castShadow=true;player.add(hat);
player.position.set(0,0,8);scene.add(player);

let state={money:500,feed:100,fem:1,male:0,eggs:0};
try{const old=JSON.parse(localStorage.getItem('chicken3d'));if(old)state=Object.assign(state,old)}catch(e){}

// Chicken model
function chickenModel(rooster=false){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),whiteMat);body.scale.set(1,.75,1.25);body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.28,14,10),whiteMat);head.position.set(0,.38,.55);head.castShadow=true;g.add(head);
 const beak=new THREE.Mesh(new THREE.ConeGeometry(.11,.28,8),mat(0xe7a62d));beak.rotation.x=Math.PI/2;beak.position.set(0,.35,.83);g.add(beak);
 const eye=mat(0x111111); for(const sx of [-.11,.11]){const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eye);e.position.set(sx,.45,.73);g.add(e)}
 const comb=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),mat(0xd7352f));comb.scale.y=1.25;comb.position.set(0,.67,.5);g.add(comb);
 if(rooster){for(const sx of [-.28,.28]){const w=new THREE.Mesh(new THREE.SphereGeometry(.27,12,8),mat(0xd9d9d3));w.scale.set(.55,.35,1);w.position.set(sx,.03,.05);g.add(w)}}
 return g;
}
const chickens=[];
function addChicken(type,x,z){
 const g=chickenModel(type==='m');g.position.set(x,.45,z);scene.add(g);
 chickens.push({g,type,x,z,tx:x,tz:z,turn:Math.random()*4,phase:Math.random()*6});
}
for(let i=0;i<state.fem;i++) addChicken('f',-5+Math.random()*12,-5+Math.random()*7);
for(let i=0;i<state.male;i++) addChicken('m',-5+Math.random()*12,-5+Math.random()*7);

function stateInit(){return state;}

function sync(){
 document.getElementById('money').textContent=state.money;
 document.getElementById('fem').textContent=state.fem;
 document.getElementById('male').textContent=state.male;
 document.getElementById('eggs').textContent=state.eggs;
 document.getElementById('feed').textContent=state.feed;
 localStorage.setItem('chicken3d',JSON.stringify(state));
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',1800)}
function buy(type){
 if(type==='female'&&state.money>=80){state.money-=80;state.fem++;addChicken('f',Math.random()*10-5,Math.random()*6-5);toast('🐔 Dişi tavuk alındı!')}
 else if(type==='male'&&state.money>=100){state.money-=100;state.male++;addChicken('m',Math.random()*10-5,Math.random()*6-5);toast('🐓 Horoz alındı!')}
 else if(type==='feed'&&state.money>=25){state.money-=25;state.feed+=50;toast('🌾 50 yem alındı!')}
 else toast('❌ Yeterli paran yok');
 sync();
}
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
const panel=document.getElementById('panel');
document.getElementById('marketBtn').addEventListener('click',e=>{e.stopPropagation();panel.style.display='block'});
document.getElementById('close').addEventListener('click',()=>panel.style.display='none');
panel.addEventListener('pointerdown',e=>e.stopPropagation());
document.getElementById('breedBtn').addEventListener('click',()=>{
 if(state.fem>0&&state.male>0&&state.feed>=3){state.feed-=3;state.eggs++;makeEgg(new THREE.Vector3(6.1+(state.eggs%5)*.9,.65,-5.05));toast('🥚 Yeni yumurta oluştu!')}
 else toast('Önce en az 1 dişi + 1 horoz ve 3 yem gerekli');
 sync();
});
sync();

// Touch joystick
const js=document.getElementById('joystick'),st=document.getElementById('stick');
let joy={x:0,y:0,down:false};
function joyMove(e){
 const r=js.getBoundingClientRect();let x=e.clientX-r.left-62.5,y=e.clientY-r.top-62.5;
 const d=Math.min(48,Math.hypot(x,y)),a=Math.atan2(y,x);
 joy.x=Math.cos(a)*d/48;joy.y=Math.sin(a)*d/48;
 st.style.left=(34+joy.x*35)+'px';st.style.top=(34+joy.y*35)+'px';
}
js.addEventListener('pointerdown',e=>{joy.down=true;js.setPointerCapture(e.pointerId);joyMove(e)});
js.addEventListener('pointermove',e=>{if(joy.down)joyMove(e)});
function joyUp(){joy.down=false;joy.x=joy.y=0;st.style.left='34px';st.style.top='34px'}
js.addEventListener('pointerup',joyUp);js.addEventListener('pointercancel',joyUp);

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 const speed=4.2;
 player.position.x+=joy.x*speed*dt;
 player.position.z+=joy.y*speed*dt;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-17,17);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);
 if(Math.hypot(joy.x,joy.y)>.1) player.rotation.y=Math.atan2(joy.x,joy.y);

 chickens.forEach((c,i)=>{
   c.turn-=dt;
   if(c.turn<=0){c.tx=THREE.MathUtils.clamp(c.x+(Math.random()-.5)*7,-.3,13.3);c.tz=THREE.MathUtils.clamp(c.z+(Math.random()-.5)*5,-7.3,2.3);c.turn=2+Math.random()*5}
   const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
   if(d>.12){c.x+=dx/d*dt*.8;c.z+=dz/d*dt*.8;c.g.rotation.y=Math.atan2(dx,dz)}
   c.g.position.x=c.x;c.g.position.z=c.z;
   c.g.position.y=.45+Math.sin(now*.006+c.phase)*.025;
 });

 const desired=new THREE.Vector3(player.position.x+8,7.2,player.position.z+10);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 const target=new THREE.Vector3(player.position.x,1,player.position.z);
 camera.lookAt(target);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
});
})();
</script>
</body>
</html>
