<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Rustik Çiftlik 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1a2b1e;
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  color:#3d2310
}

#game-container{
  width:100%;
  height:100%;
  position:absolute;
  inset:0
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
  opacity:0;
  transition:opacity .8s
}

.top{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.stat{
  background:rgba(247,245,237,.92);
  border:2px solid #6e4726;
  border-radius:12px;
  padding:8px 12px;
  font-weight:bold;
  font-size:13px;
  backdrop-filter:blur(5px);
  box-shadow:0 5px 12px rgba(0,0,0,.3);
  display:flex;
  align-items:center;
  gap:6px
}

.actions{
  position:absolute;
  right:12px;
  bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:auto
}

button{
  border:2px solid #3d2310;
  border-radius:12px;
  padding:14px 18px;
  background:#c19a6b;
  color:#3d2310;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 6px 0 #6e4726,0 6px 15px rgba(0,0,0,.4);
  cursor:pointer;
  transition:transform .1s,box-shadow .1s
}

button:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #6e4726,0 3px 10px rgba(0,0,0,.4)
}

#breedBtn{
  background:#b25329;
  color:#f7f5ed
}

#marketBtn{
  background:#e0a96d
}

#sellEggsBtn{
  background:#2e7d32;
  color:#fff
}

.rounds{
  position:absolute;
  left:150px;
  bottom:max(20px,env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  pointer-events:auto
}

.round{
  width:68px;
  height:68px;
  border-radius:50%;
  padding:4px;
  background:rgba(247,245,237,.9);
  border:2px solid #6e4726;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#3d2310;
  font-weight:bold;
  box-shadow:0 5px 12px rgba(0,0,0,.3)
}

.round span{
  font-size:22px
}

#joystick{
  position:absolute;
  left:18px;
  bottom:max(20px,env(safe-area-inset-bottom));
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(70,50,30,.32);
  border:3px solid #6e4726;
  pointer-events:auto;
  touch-action:none;
  box-shadow:inset 0 0 20px rgba(0,0,0,.2)
}

#stick{
  position:absolute;
  width:54px;
  height:54px;
  border-radius:50%;
  left:33px;
  top:33px;
  background:rgba(247,245,237,.95);
  border:2px solid #3d2310;
  box-shadow:0 4px 12px rgba(0,0,0,.4)
}

.panel{
  display:none;
  position:fixed;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(94vw,700px);
  max-height:85vh;
  overflow:auto;
  background:#f7f5ed;
  color:#3d2310;
  border:3px solid #6e4726;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.6)
}

.panel h2{
  margin:0 0 15px;
  color:#6e4726;
  border-bottom:2px solid #c8d3c4;
  padding-bottom:8px;
  font-size:20px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:2px solid #c8d3c4;
  border-radius:15px;
  padding:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 4px 12px rgba(0,0,0,.08)
}

.card-preview{
  width:100%;
  height:130px;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:10px;
  border:1px solid rgba(0,0,0,.15);
  position:relative;
  background:linear-gradient(#8dc9ed,#d9e8cf)
}

.preview-canvas{
  width:100%;
  height:100%;
  display:block
}

.card-badge{
  position:absolute;
  top:6px;
  right:6px;
  font-size:10px;
  padding:3px 8px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-weight:bold;
  letter-spacing:.5px;
  z-index:2
}

.card h3{
  margin:0 0 4px;
  font-size:15px
}

.card p{
  font-size:11px;
  margin:3px 0 10px;
  color:#5c4033;
  line-height:1.35
}

.card button{
  width:100%;
  padding:10px;
  background:#4a7a4c;
  color:#f7f5ed;
  border:none;
  box-shadow:0 3px 0 #2e512f;
  font-size:13px;
  border-radius:8px
}

.close{
  width:100%;
  background:#5c4033;
  color:#f7f5ed;
  margin-top:15px;
  border:none;
  border-radius:10px;
  padding:12px
}

.toast{
  display:none;
  position:fixed;
  z-index:30;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(61,35,16,.95);
  color:#f7f5ed;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  text-align:center
}

#startOverlay{
  position:fixed;
  inset:0;
  background:rgba(26,43,30,.88);
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(8px);
  transition:opacity .8s
}

#startOverlay h1{
  font-size:36px;
  margin-bottom:10px;
  text-shadow:0 4px 12px #000;
  color:#c19a6b;
  text-align:center
}

#startOverlay p{
  font-size:14px;
  margin-bottom:25px;
  color:#ddd;
  text-align:center
}

#startBtn{
  font-size:18px;
  padding:15px 40px;
  background:#44a059;
  color:white;
  border:none;
  border-radius:35px;
  box-shadow:0 6px 20px rgba(0,0,0,.4)
}

@media(max-width:620px){

  .stat{
    font-size:10px;
    padding:6px 8px
  }

  .rounds{
    left:140px
  }

  .round{
    width:56px;
    height:56px;
    font-size:9px
  }

  .round span{
    font-size:18px
  }

  .actions button{
    padding:10px 12px
  }

  #startOverlay h1{
    font-size:27px
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body>

<div id="game-container"></div>

<div id="startOverlay">

  <h1>🌿 RUSTİK BAHÇELİ ÇİFTLİK 3D</h1>

  <p>
    Gerçekçi 3D insan • Tavuklar • Horozlar • Kuluçka
  </p>

  <button id="startBtn">
    OYUNA BAŞLA
  </button>

</div>

<div id="hud">

  <div class="top">

    <div class="stat">
      💰 <span id="money">500</span> ₺
    </div>

    <div class="stat">
      🐔 Dişi: <span id="fem">3</span>
    </div>

    <div class="stat">
      🐓 Horoz: <span id="male">2</span>
    </div>

    <div class="stat">
      🐣 Civciv: <span id="chicks">0</span>
    </div>

    <div class="stat">
      📦 Stok: <span id="stashedEggs">0</span>
    </div>

    <div class="stat">
      🌾 Yem: <span id="feed">100</span>
    </div>

  </div>

  <div class="actions">

    <button id="sellEggsBtn">
      💰 YUMURTA SAT
    </button>

    <button id="marketBtn">
      🛒 PAZAR / MARKET
    </button>

    <button id="breedBtn">
      🪺 KULUÇKAYA YATIR
    </button>

  </div>

  <div class="rounds">

    <button class="round" id="feedBtn">
      <span>🌾</span>
      YEM VER
    </button>

    <button class="round" id="collectBtn">
      <span>🥚</span>
      TOPLA
    </button>

  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

</div>

<div id="toast" class="toast"></div>

<div id="market" class="panel">

  <h2>🛒 3D Canlı Hayvan Pazarı</h2>

  <div class="grid" id="breedGrid"></div>

  <div class="card" style="margin-top:14px;background:#f0e6d2">

    <div class="card-preview"
         style="height:100px;background:#d4b483;display:flex;align-items:center;justify-content:center;font-size:55px">
      🌾
    </div>

    <h3>🌾 50 KG Çiftlik Yemi</h3>

    <p>
      Tavukların beslenmesi ve yumurta verimi için gerekli yem stoğu.
    </p>

    <button id="buyFeedBtn">
      25 ₺ Satın Al
    </button>

  </div>

  <button class="close" id="closeMarketBtn">
    MARKETİ KAPAT
  </button>

</div>

<script>

const container =
document.getElementById('game-container');

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xa7d8f5);

scene.fog =
new THREE.FogExp2(0xa7d8f5,0.012);

const camera =
new THREE.PerspectiveCamera(
  45,
  window.innerWidth/window.innerHeight,
  .1,
  1000
);

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);


// =============================
// IŞIK
// =============================

const ambientLight =
new THREE.HemisphereLight(
  0xffffff,
  0x587348,
  1.1
);

scene.add(ambientLight);

const sunLight =
new THREE.DirectionalLight(
  0xffe3b5,
  1.8
);

sunLight.position.set(30,50,25);

sunLight.castShadow=true;

sunLight.shadow.mapSize.width=2048;
sunLight.shadow.mapSize.height=2048;

sunLight.shadow.camera.left=-35;
sunLight.shadow.camera.right=35;
sunLight.shadow.camera.top=35;
sunLight.shadow.camera.bottom=-35;

scene.add(sunLight);


// =============================
// ZEMİN
// =============================

const groundMat =
new THREE.MeshStandardMaterial({
  color:0x4d8038,
  roughness:.95
});

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(65,65),
  groundMat
);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


// =============================
// ÇİTLER
// =============================

const fenceMat =
new THREE.MeshStandardMaterial({
  color:0x5c4033,
  roughness:.8
});

function createFenceSegment(x,z,rotY){

  const group =
  new THREE.Group();

  const post1 =
  new THREE.Mesh(
    new THREE.BoxGeometry(.2,1.2,.2),
    fenceMat
  );

  post1.position.set(-1.5,.6,0);

  const post2 =
  new THREE.Mesh(
    new THREE.BoxGeometry(.2,1.2,.2),
    fenceMat
  );

  post2.position.set(1.5,.6,0);

  const rail1 =
  new THREE.Mesh(
    new THREE.BoxGeometry(3.2,.12,.08),
    fenceMat
  );

  rail1.position.y=.85;

  const rail2 =
  new THREE.Mesh(
    new THREE.BoxGeometry(3.2,.12,.08),
    fenceMat
  );

  rail2.position.y=.45;

  group.add(post1,post2,rail1,rail2);

  group.position.set(x,0,z);

  group.rotation.y=rotY;

  group.traverse(o=>{
    if(o.isMesh)o.castShadow=true;
  });

  scene.add(group);
}

for(let i=-21;i<=21;i+=3){

  createFenceSegment(i,-24,0);
  createFenceSegment(i,24,0);

  createFenceSegment(-24,i,Math.PI/2);
  createFenceSegment(24,i,Math.PI/2);

}


// =============================
// OT
// =============================

const grassMat1 =
new THREE.MeshStandardMaterial({
  color:0x3b6e22
});

const grassMat2 =
new THREE.MeshStandardMaterial({
  color:0x588e32
});

function createGrassTuft(x,z){

  const group =
  new THREE.Group();

  const mat =
  Math.random()>.5
  ?grassMat1
  :grassMat2;

  for(let i=0;i<7;i++){

    const blade =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .08,
        .4+Math.random()*.3,
        4
      ),
      mat
    );

    blade.position.set(
      (Math.random()-.5)*.3,
      .2,
      (Math.random()-.5)*.3
    );

    blade.rotation.x =
    (Math.random()-.5)*.4;

    blade.rotation.z =
    (Math.random()-.5)*.4;

    group.add(blade);
  }

  group.position.set(x,0,z);

  scene.add(group);
}

for(let i=0;i<100;i++){

  const x=(Math.random()-.5)*44;
  const z=(Math.random()-.5)*44;

  if(Math.hypot(x+11,z+11)>5){

    createGrassTuft(x,z);

  }

}


// =============================
// KÜMES
// =============================

const coop =
new THREE.Group();

const woodMat =
new THREE.MeshStandardMaterial({
  color:0x6e4726,
  roughness:.85
});

const coopWalls =
new THREE.Mesh(
  new THREE.BoxGeometry(4.8,3,3.8),
  woodMat
);

coopWalls.position.y=1.5;

coop.add(coopWalls);

const roof =
new THREE.Mesh(
  new THREE.ConeGeometry(4.5,2,4),
  new THREE.MeshStandardMaterial({
    color:0x8b2500,
    roughness:.8
  })
);

roof.position.y=3.9;

roof.rotation.y=Math.PI/4;

coop.add(roof);

coop.position.set(-11,0,-11);

coop.traverse(o=>{
  if(o.isMesh)o.castShadow=true;
});

scene.add(coop);


{

  const post =
  new THREE.Mesh(
    new THREE.BoxGeometry(.15,1.8,.15),
    woodMat
  );

  post.position.set(...p);

  nestZone.add(post);

}

const hutRoof =
new THREE.Mesh(
  new THREE.BoxGeometry(2.8,.15,2.8),
  new THREE.MeshStandardMaterial({
    color:0x8b2500
  })
);

hutRoof.position.y=1.85;

nestZone.add(hutRoof);

const strawBed =
new THREE.Mesh(
  new THREE.CylinderGeometry(1,.8,.3,16),
  new THREE.MeshStandardMaterial({
    color:0xd4a359,
    roughness:1
  })
);

strawBed.position.y=.15;

nestZone.add(strawBed);

nestZone.position.set(12,0,-12);

scene.add(nestZone);


// ==================================================
// GERÇEKÇİ 3D İNSAN OYUNCU
// ==================================================

const player =
new THREE.Group();

const skinMat =
new THREE.MeshStandardMaterial({
  color:0xc98f6b,
  roughness:.9
});

const shirtMat =
new THREE.MeshStandardMaterial({
  color:0x315f52,
  roughness:.9
});

const pantsMat =
new THREE.MeshStandardMaterial({
  color:0x20252b,
  roughness:.9
});

const shoeMat =
new THREE.MeshStandardMaterial({
  color:0x151515,
  roughness:.8
});

const hairMat =
new THREE.MeshStandardMaterial({
  color:0x211711,
  roughness:1
});


// Gövde

const body =
new THREE.Mesh(
  new THREE.CapsuleGeometry(.38,.72,8,16),
  shirtMat
);

body.position.y=1.25;

body.scale.set(.95,1,.58);

player.add(body);


// Boyun

const neck =
new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.15,.22,14),
  skinMat
);

neck.position.y=1.83;

player.add(neck);


// Kafa

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(.29,20,16),
  skinMat
);

head.position.y=2.12;

head.scale.set(.9,1.05,.9);

player.add(head);


// Saç

const hair =
new THREE.Mesh(
  new THREE.SphereGeometry(.30,18,14),
  hairMat
);

hair.position.set(0,2.28,-.02);

hair.scale.set(.95,.55,.92);

player.add(hair);


// Burun

const nose =
new THREE.Mesh(
  new THREE.SphereGeometry(.055,10,8),
  skinMat
);

nose.position.set(0,2.08,.285);

nose.scale.set(.7,.8,1);

player.add(nose);


// Kollar

const armGeo =
new THREE.CapsuleGeometry(.105,.55,6,10);

const leftArm =
new THREE.Mesh(armGeo,shirtMat);

leftArm.position.set(-.48,1.36,0);

leftArm.rotation.z=-.12;

const rightArm =
new THREE.Mesh(armGeo,shirtMat);

rightArm.position.set(.48,1.36,0);

rightArm.rotation.z=.12;

player.add(leftArm,rightArm);


// Eller

const leftHand =
new THREE.Mesh(
  new THREE.SphereGeometry(.12,12,10),
  skinMat
);

leftHand.position.set(-.49,.98,0);

const rightHand =
new THREE.Mesh(
  new THREE.SphereGeometry(.12,12,10),
  skinMat
);

rightHand.position.set(.49,.98,0);

player.add(leftHand,rightHand);


// Bacaklar

const legGeo =
new THREE.CapsuleGeometry(.13,.62,6,10);

const leftLeg =
new THREE.Mesh(legGeo,pantsMat);

leftLeg.position.set(-.19,.55,0);

const rightLeg =
new THREE.Mesh(legGeo,pantsMat);

rightLeg.position.set(.19,.55,0);

player.add(leftLeg,rightLeg);


// Ayakkabılar

const leftFoot =
new THREE.Mesh(
  new THREE.BoxGeometry(.23,.14,.45),
  shoeMat
);

leftFoot.position.set(-.19,.12,.10);

const rightFoot =
new THREE.Mesh(
  new THREE.BoxGeometry(.23,.14,.45),
  shoeMat
);

rightFoot.position.set(.19,.12,.10);

player.add(leftFoot,rightFoot);


// Gölge

player.traverse(o=>{

  if(o.isMesh){

    o.castShadow=true;
    o.receiveShadow=true;

  }

});

scene.add(player);


// ==================================================
// TAVUK / HOROZ MODELİ
// ==================================================

function createChickenModel(
  colorHex,
  isMale,
  isChick=false
){

  const group =
  new THREE.Group();

  const scale =
  isChick
  ? .42
  : isMale
  ? 1.25
  : .98;


  const featherMat =
  new THREE.MeshStandardMaterial({
    color:colorHex,
    roughness:.82
  });

  const featherDarkMat =
  new THREE.MeshStandardMaterial({
    color:colorHex,
    roughness:.95
  });

  const redMat =
  new THREE.MeshStandardMaterial({
    color:0xc91f1f,
    roughness:.5
  });

  const beakMat =
  new THREE.MeshStandardMaterial({
    color:0xe9a313,
    roughness:.45
  });

  const legMat =
  new THREE.MeshStandardMaterial({
    color:0xd08316,
    roughness:.6
  });

  const eyeMat =
  new THREE.MeshStandardMaterial({
    color:0x111111,
    roughness:.3
  });


  // Ana gövde

  const body =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .48*scale,
      24,
      18
    ),
    featherMat
  );

  body.scale.set(
    .9,
    .86,
    1.3
  );

  body.position.y=.55*scale;

  group.add(body);


  // Göğüs tüyü

  const chest =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .32*scale,
      18,
      14
    ),
    featherDarkMat
  );

  chest.scale.set(.85,1.05,.75);

  chest.position.set(
    0,
    .57*scale,
    .38*scale
  );

  group.add(chest);


  // Kanatlar

  [-1,1].forEach(side=>{

    const wing =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .27*scale,
        18,
        14
      ),
      featherDarkMat
    );

    wing.scale.set(
      .45,
      .95,
      1.1
    );

    wing.position.set(
      side*.38*scale,
      .55*scale,
      .02*scale
    );

    wing.rotation.z=
    side*.35;

    group.add(wing);

  });


  // Boyun

  const neckChicken =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .22*scale,
      18,
      14
    ),
    featherMat
  );

  neckChicken.position.set(
    0,
    .82*scale,
    .25*scale
  );

  neckChicken.scale.set(
    .9,
    1.15,
    .9
  );

  group.add(neckChicken);


  // Baş

  const headChicken =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .22*scale,
      20,
      16
    ),
    featherMat
  );

  headChicken.position.set(
    0,
    1.04*scale,
    .36*scale
  );

  group.add(headChicken);


  // Gözler

  [-1,1].forEach(side=>{

    const eye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .045*scale,
        12,
        10
      ),
      eyeMat
    );

    eye.position.set(
      side*.145*scale,
      1.07*scale,
      .535*scale
    );

    group.add(eye);

  });


  // Gaga

  const beak =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      .075*scale,
      .22*scale,
      4
    ),
    beakMat
  );

  beak.rotation.x=Math.PI/2;

  beak.position.set(
    0,
    1.01*scale,
    .58*scale
  );

  group.add(beak);


  // İBİK

  if(!isChick){

    if(isMale){

      for(let i=0;i<5;i++){

        const comb =
        new THREE.Mesh(
          new THREE.SphereGeometry(
            .10*scale,
            12,
            10
          ),
          redMat
        );

        comb.scale.set(
          .8,
          1.15,
          .65
        );

        comb.position.set(
          (i-2)*.07*scale,
          (1.25+Math.sin(i)*.03)*scale,
          .33*scale
        );

        group.add(comb);

      }

      // Sakal

      const wattle1 =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .09*scale,
          12,
          10
        ),
        redMat
      );

      wattle1.scale.set(.65,1.4,.6);

      wattle1.position.set(
        -.08*scale,
        .87*scale,
        .52*scale
      );

      const wattle2 =
      wattle1.clone();

      wattle2.position.x=.08*scale;

      group.add(wattle1,wattle2);


      // Uzun kuyruk

      for(let i=0;i<7;i++){

        const tail =
        new THREE.Mesh(
          new THREE.CapsuleGeometry(
            .055*scale,
            .48*scale,
            5,
            8
          ),
          featherDarkMat
        );

        tail.position.set(
          (i-3)*.07*scale,
          (.75+i*.045)*scale,
          (-.48-i*.055)*scale
        );

        tail.rotation.x=
        -1.05-(i%2)*.12;

        tail.rotation.z=
        (i-3)*.06;

        group.add(tail);

      }

    }else{

      // Küçük ibik

      const comb =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .08*scale,
          12,
          10
        ),
        redMat
      );

      comb.scale.set(.7,1.2,.6);

      comb.position.set(
        0,
        1.21*scale,
        .35*scale
      );

      group.add(comb);


      // Tavuk kuyruğu

      for(let i=0;i<4;i++){

        const tail =
        new THREE.Mesh(
          new THREE.CapsuleGeometry(
            .045*scale,
            .35*scale,
            5,
            8
          ),
          featherDarkMat
        );

        tail.position.set(
          (i-1.5)*.06*scale,
          .76*scale,
          -.48*scale
        );

        tail.rotation.x=-1.1;

        group.add(tail);

      }

    }


    // Bacaklar

    [-1,1].forEach(side=>{

      const leg =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .025*scale,
          .035*scale,
          .32*scale,
          8
        ),
        legMat
      );

      leg.position.set(
        side*.14*scale,
        .20*scale,
        .03*scale
      );

      group.add(leg);


      // Parmak

      for(let f=0;f<3;f++){

        const toe =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .012*scale,
            .018*scale,
            .16*scale,
            6
          ),
          legMat
        );

        toe.position.set(
          side*.14*scale+
          (f-1)*.045*scale,
          .045*scale,
          .12*scale
        );

        toe.rotation.x=Math.PI/2;

        group.add(toe);

      }

    });

  }

  group.traverse(o=>{

    if(o.isMesh){

      o.castShadow=true;
      o.receiveShadow=true;

    }

  });

  return group;
}

// ==================================================

function spawnChicken(
  breedName,
  isChick=false,
  customX=null,
  customZ=null,
  customAge=null
){

  const b=
  breeds[breedName] ||
  {
    sex:'f',
    color:0xffd700
  };

  const color=
  isChick
  ?0xffe135
  :b.color;

  const mesh=
  createChickenModel(
    color,
    b.sex==='m',
    isChick
  );

  const x=
  customX!==null
  ?customX
  :(Math.random()-.5)*18;

  const z=
  customZ!==null
  ?customZ
  :(Math.random()-.5)*18;

  mesh.position.set(x,0,z);

  scene.add(mesh);

  chickens.push({

    mesh:mesh,

    sex:b.sex,

    breed:breedName,

    isChick:isChick,

    age:
    customAge!==null
    ?customAge
    :(isChick?0:100),

    tx:x,

    tz:z,

    timer:Math.random()*3,

    eggTimer:18+Math.random()*12,

    isNesting:false

  });

  saveGame();
}

function spawnEggMesh(x,z){

  const egg=
  new THREE.Mesh(
    new THREE.SphereGeometry(.13,14,12),
    new THREE.MeshStandardMaterial({
      color:0xf7e6d2,
      roughness:.6
    })
  );

  egg.scale.set(1,1.35,1);

  egg.position.set(x,.1,z);

  egg.castShadow=true;

  scene.add(egg);

  groundEggs.push(egg);

  saveGame();
}


// ==================================================
// SAVE
// ==================================================

function saveGame(){

  const saveData={

    state:state,

    chickens:
    chickens.map(c=>({

      breed:c.breed,
      sex:c.sex,
      isChick:c.isChick,
      age:c.age,

      x:
      parseFloat(
        c.mesh.position.x.toFixed(2)
      ),

      z:
      parseFloat(
        c.mesh.position.z.toFixed(2)
      )

    })),

    eggs:
    groundEggs.map(e=>({

      x:
      parseFloat(
        e.position.x.toFixed(2)
      ),

      z:
      parseFloat(
        e.position.z.toFixed(2)
      )

    }))

  };

  localStorage.setItem(
    'rustik_ciftlik_save',
    JSON.stringify(saveData)
  );
}


// ==================================================
// LOAD
// ==================================================

function loadGame(){

  const saved=
  localStorage.getItem(
    'rustik_ciftlik_save'
  );

  if(!saved)return false;

  try{

    const data=
    JSON.parse(saved);

    state=data.state;

    state.incubating=false;

    chickens.forEach(
      c=>scene.remove(c.mesh)
    );

    chickens=[];

    groundEggs.forEach(
      e=>scene.remove(e)
    );

    groundEggs=[];


    if(data.chickens){

      data.chickens.forEach(c=>{

        spawnChicken(
          c.breed,
          c.isChick,
          c.x,
          c.z,
          c.age
        );

      });

    }


    if(data.eggs){

      data.eggs.forEach(e=>{

        spawnEggMesh(
          e.x,
          e.z
        );

      });

    }

    return true;

  }catch(e){

    console.error(e);

    return false;

  }

}

// Küçük 3D market önizlemeleri

function createMarketPreview(
  containerElement,
  breed
){

  const canvas=
  document.createElement('canvas');

  canvas.className='preview-canvas';

  containerElement.appendChild(canvas);


  const previewScene=
  new THREE.Scene();

  previewScene.background=
  new THREE.Color(0xb8d9e8);


  const previewCamera=
  new THREE.PerspectiveCamera(
    35,
    1.6,
    .1,
    100
  );

  previewCamera.position.set(
    0,
    1.2,
    4
  );


  const previewRenderer=
  new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    alpha:false
  });

  previewRenderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
  );

  previewRenderer.setSize(
    380,
    240,
    false
  );

  previewRenderer.shadowMap.enabled=true;


  const light=
  new THREE.HemisphereLight(
    0xffffff,
    0x557044,
    1.4
  );

  previewScene.add(light);


  const sun=
  new THREE.DirectionalLight(
    0xffffff,
    1.8
  );

  sun.position.set(3,5,4);

  sun.castShadow=true;

  previewScene.add(sun);


  const floor=
  new THREE.Mesh(
    new THREE.CircleGeometry(3,32),
    new THREE.MeshStandardMaterial({
      color:0x759451,
      roughness:1
    })
  );

  floor.rotation.x=-Math.PI/2;

  floor.position.y=-.02;

  previewScene.add(floor);


  const animal=
  createChickenModel(
    breed.color,
    breed.sex==='m',
    false
  );

  animal.position.y=.02;

  animal.rotation.y=.45;

  previewScene.add(animal);


  function renderPreview(){

    requestAnimationFrame(renderPreview);

    animal.rotation.y=
    .45+
    Math.sin(performance.now()*.001)*.05;

    previewRenderer.render(
      previewScene,
      previewCamera
    );

  }

  renderPreview();

}

let joy={
  x:0,
  y:0,
  active:false
};

const js=
document.getElementById('joystick');

const st=
document.getElementById('stick');


function handleMove(e){

  const r=
  js.getBoundingClientRect();

  let x=
  e.clientX-
  r.left-
  r.width/2;

  let y=
  e.clientY-
  r.top-
  r.height/2;

  const max=45;

  const distance=
  Math.hypot(x,y);

  if(distance>max){

    x=
    x/distance*max;

    y=
    y/distance*max;

  }

  joy.x=x/max;

  joy.y=y/max;

  st.style.left=
  (33+joy.x*30)+'px';

  st.style.top=
  (33+joy.y*30)+'px';

}


js.addEventListener(
  'pointerdown',
  e=>{

    joy.active=true;

    js.setPointerCapture(
      e.pointerId
    );

    handleMove(e);

  }
);


js.addEventListener(
  'pointermove',
  e=>{

    if(joy.active){

      handleMove(e);

    }

  }
);


function endJoy(){

  joy.active=false;

  joy.x=0;

  joy.y=0;

  st.style.left='33px';

  st.style.top='33px';

}


js.addEventListener(
  'pointerup',
  endJoy
);

js.addEventListener(
  'pointercancel',
  endJoy
);


// ==================================================
// ANİMASYON
// ==================================================

const clock=
new THREE.Clock();

let animTime=0;


function animate(){

  requestAnimationFrame(animate);

  const dt=
  clock.getDelta();

  const elapsedTime=
  clock.getElapsedTime();

  animTime+=dt*8;


  // =========================
  // OYUNCU HAREKETİ
  // =========================

  if(joy.active){

    const speed=5.5;

    player.position.x+=
    joy.x*speed*dt;

    player.position.z+=
    joy.y*speed*dt;


    // Hareket yönüne dön

    if(Math.abs(joy.x)+Math.abs(joy.y)>.05){

      player.rotation.y=
      Math.atan2(
        joy.x,
        joy.y
      );

    }


    // Yürüme animasyonu

    const walk=
    Math.sin(
      elapsedTime*9
    );


    leftLeg.rotation.x=
    walk*.65;

    rightLeg.rotation.x=
    -walk*.65;


    leftArm.rotation.x=
    -walk*.35;

    rightArm.rotation.x=
    walk*.35;


    // Hafif gövde hareketi

    body.position.y=
    1.25+
    Math.abs(walk)*.025;


  }else{

    // Durduğunda animasyonu yavaşça sıfırla

    leftLeg.rotation.x*=.8;
    rightLeg.rotation.x*=.8;

    leftArm.rotation.x*=.8;
    rightArm.rotation.x*=.8;

    body.position.y=
    1.25;

  }


  // Sınırlar

  player.position.x=
  Math.max(
    -23,
    Math.min(
      23,
      player.position.x
    )
  );

  player.position.z=
  Math.max(
    -23,
    Math.min(
      23,
      player.position.z
    )
  );


  // =========================
  // KAMERA
  // =========================

  camera.position.set(
    player.position.x+1,
    player.position.y+8.5,
    player.position.z+12
  );

  camera.lookAt(
    player.position.x,
    player.position.y+1,
    player.position.z
  );


  // =========================
  // TAVUK YAPAY ZEKA
  // =========================

  chickens.forEach(c=>{

    if(!c.isNesting){

      c.timer-=dt;

      if(c.timer<=0){

        c.tx=
        (Math.random()-.5)*22;

        c.tz=
        (Math.random()-.5)*22;

        c.timer=
        3+Math.random()*4;

      }

    }


    const dx=
    c.tx-
    c.mesh.position.x;

    const dz=
    c.tz-
    c.mesh.position.z;

    const dist=
    Math.hypot(dx,dz);


    if(dist>.4){

      const speed=
      c.isChick
      ?2.2
      :1.3;

      c.mesh.position.x+=
      dx/dist*speed*dt;

      c.mesh.position.z+=
      dz/dist*speed*dt;

      c.mesh.rotation.y=
      Math.atan2(dx,dz);


      c.mesh.position.y=
      Math.abs(
        Math.sin(animTime*1.5)
      )*.08;

    }else{

      if(c.isNesting){

        c.mesh.position.y=.15;

      }

    }


    // =========================
    // CİVCİV BÜYÜMESİ
    // =========================

    if(c.isChick){

      c.age+=dt*3;

      if(c.age>=100){

        c.isChick=false;

        scene.remove(c.mesh);

        c.mesh=
        createChickenModel(
          breeds[c.breed].color,
          c.sex==='m',
          false
        );

        c.mesh.position.set(
          c.tx,
          0,
          c.tz
        );

        scene.add(c.mesh);

        updateUI();

        toast(
          '🐓 Civciv büyüyüp yetişkin oldu!'
        );

        saveGame();

      }


    // =========================
    // YUMURTA
    // =========================

    }else if(
      c.sex==='f' &&
      !c.isNesting
    ){

      c.eggTimer-=dt;

      if(c.eggTimer<=0){

        c.eggTimer=
        20+
        Math.random()*15;

        spawnEggMesh(
          c.mesh.position.x,
          c.mesh.position.z
        );

        toast(
          '🥚 Taze yumurta bırakıldı!'
        );

      }

    }

  });


  renderer.render(
    scene,
    camera
  );

}


// ==================================================
// OTOMATİK KAYIT
// ==================================================

window.addEventListener(
  'beforeunload',
  ()=>{
    saveGame();
  }
);

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(document.hidden){

      saveGame();

    }

  }
);

setInterval(
  ()=>{
    saveGame();
  },
  5000
);


// ==================================================
// EKRAN BOYUTU
// ==================================================

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
    window.innerWidth/
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ==================================================
// BAŞLAT
// ==================================================

updateUI();

animate();

</script>

</body>
</html>
