<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tavuk Çiftliği 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a2b1e;font-family:Arial,sans-serif;color:#fff}
#game-container{width:100%;height:100%;position:absolute;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 0.8s}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap}
.stat{background:rgba(19,33,27,0.85);border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:8px 12px;font-weight:bold;font-size:14px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,0.3)}
.actions{position:absolute;right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
button{border:1px solid rgba(255,255,255,0.3);border-radius:14px;padding:12px 16px;background:#2e7140;color:#fff;font-size:14px;font-weight:bold;box-shadow:0 5px 15px rgba(0,0,0,0.4);cursor:pointer}
button:active{transform:scale(.96)}
#breedBtn{background:#9a3d39}
.rounds{position:absolute;left:150px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.round{width:64px;height:64px;border-radius:50%;padding:4px;background:rgba(23,36,29,0.85);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.round span{font-size:20px}
#joystick{position:absolute;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(16,32,25,0.4);border:2px solid rgba(255,255,255,0.5);pointer-events:auto}
#stick{position:absolute;width:50px;height:50px;border-radius:50%;left:33px;top:33px;background:rgba(244,244,237,0.8);border:2px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,0.4)}
.panel{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,550px);max-height:80vh;overflow:auto;background:#f7f5ed;color:#17231c;border-radius:20px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,0.6)}
.panel h2{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:#e9efe4;border:1px solid #c8d3c4;border-radius:15px;padding:10px}
.card h3{margin:0 0 5px;font-size:15px}
.card p{font-size:11px;margin:5px 0;color:#4d5c50}
.card button{width:100%;padding:8px;margin-top:5px;background:#2d713e}
.close{width:100%;background:#333;margin-top:12px}
.toast{display:none;position:fixed;z-index:30;top:80px;left:50%;transform:translateX(-50%);background:rgba(19,33,27,0.9);color:#fff;padding:10px 16px;border-radius:12px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.help{position:absolute;left:50%;top:55px;transform:translateX(-50%);font-size:12px;background:rgba(18,32,23,0.7);border-radius:10px;padding:5px 12px;text-align:center}
#startOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;backdrop-filter:blur(6px);transition:opacity 0.8s}
#startOverlay h1{font-size:36px;margin-bottom:8px;text-shadow:0 4px 12px #000}
#startOverlay p{font-size:14px;margin-bottom:24px;color:#ddd}
#startBtn{font-size:18px;padding:14px 40px;background:#44a059;border:none;border-radius:30px;color:white;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,0.4);cursor:pointer}
@media(max-width:620px){.stat{font-size:11px;padding:6px 8px}.rounds{left:140px}.round{width:52px;height:52px;font-size:8px}.round span{font-size:16px}.actions button{padding:10px 12px}}
</style>
<!-- Three.js Kütüphanesi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<div id="startOverlay">
  <h1>🐔 ÇİFTLİK 3D</h1>
  <p>Gelişmiş Çiftlik Simülasyonu</p>
  <button id="startBtn">OYUNA BAŞLA</button>
</div>

<div id="hud">
  <div class="top">
    <div class="stat">💰 <span id="money">500</span> ₺</div>
    <div class="stat">🐔 Dişi: <span id="fem">1</span></div>
    <div class="stat">🐓 Horoz: <span id="male">0</span></div>
    <div class="stat">🥚 Yumurta: <span id="eggs">0</span></div>
    <div class="stat">🌾 Yem: <span id="feed">100</span></div>
  </div>
  <div class="help">Marketten tavuk al • Yumurtaları topla ve sat</div>
  <div class="actions">
    <button id="marketBtn">🛒 MARKET</button>
    <button id="breedBtn">❤️ ÇİFTLEŞTİR</button>
  </div>
  <div class="rounds">
    <button class="round" id="feedBtn"><span>🌾</span>YEM VER</button>
    <button class="round" id="collectBtn"><span>🥚</span>TOPLA</button>
  </div>
  <div id="joystick"><div id="stick"></div></div>
</div>

<div id="toast" class="toast"></div>

<div id="market" class="panel">
  <h2>🐔 Canlı Tavuk Pazarı</h2>
  <div class="grid" id="breedGrid"></div>
  <div class="card" style="margin-top:10px;">
    <h3>🌾 50 Yem Stock</h3>
    <p>Çiftlik yem stoğunu artırır.</p>
    <button id="buyFeedBtn">25 ₺ Satın Al</button>
  </div>
  <button class="close" id="closeMarketBtn">MARKETİ KAPAT</button>
</div>

<script>
// --- Three.js Kurulumu ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Gökyüzü Mavisi
scene.fog = new THREE.Fog(0x87ceeb, 20, 50);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Işıklandırma
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// --- Çevre Mantığı ---
// Çim Zemin
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x4e8d38 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Çitler
function createFence() {
  const fenceMat = new THREE.MeshLambertMaterial({ color: 0x7c4c23 });
  for(let i = -20; i <= 20; i += 4) {
    [-20, 20].forEach(z => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.5, 0.3), fenceMat);
      p.position.set(i, 0.75, z);
      scene.add(p);
      const h = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 0.1), fenceMat);
      h.position.set(i, 1, z);
      scene.add(h);
    });
  }
}
createFence();

// Kümes
const coopGroup = new THREE.Group();
const coopBody = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 3), new THREE.MeshLambertMaterial({ color: 0x8b4513 }));
coopBody.position.y = 1.25;
coopBody.castShadow = true;
coopGroup.add(coopBody);

const coopRoof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 1.5, 4), new THREE.MeshLambertMaterial({ color: 0xa52a2a }));
coopRoof.position.y = 3.25;
coopRoof.rotation.y = Math.PI / 4;
coopGroup.add(coopRoof);
coopGroup.position.set(-8, 0, -8);
scene.add(coopGroup);

// --- Oyuncu (Karakter) ---
const playerGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.5), new THREE.MeshLambertMaterial({ color: 0x2b529a }));
bodyMesh.position.y = 0.7;
bodyMesh.castShadow = true;
playerGroup.add(bodyMesh);

const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
headMesh.position.y = 1.65;
playerGroup.add(headMesh);
scene.add(playerGroup);

// --- Durum ve Tavuk Mantığı ---
let state = { money: 500, feed: 100, eggs: 0 };
const breeds = {
 'Lohman Brown': { sex: 'f', price: 90, color: 0xb25329, desc: 'Yüksek yumurta verimi.' },
 'Australorp': { sex: 'f', price: 120, color: 0x222222, desc: 'Siyah cins, dayanıklı.' },
 'Leghorn': { sex: 'f', price: 140, color: 0xf0f0f0, desc: 'Beyaz hafif tavuk.' },
 'Kızıl Horoz': { sex: 'm', price: 160, color: 0xd33f11, desc: 'Çiftleşme için horoz.' }
};

let chickens = [];

function createChickenMesh(colorHex, isMale) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: colorHex });
  
  // Gövde
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.8), mat);
  body.position.y = 0.35;
  body.castShadow = true;
  group.add(body);
  
  // İbik (Kırmızı)
  const comb = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.3), new THREE.MeshLambertMaterial({ color: 0xcc1111 }));
  comb.position.set(0, 0.7, 0.3);
  group.add(comb);

  if (isMale) group.scale.set(1.2, 1.2, 1.2);
  return group;
}

function spawnChicken(breedName) {
  const b = breeds[breedName];
  const mesh = createChickenMesh(b.color, b.sex === 'm');
  const x = (Math.random() - 0.5) * 15;
  const z = (Math.random() - 0.5) * 15;
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  
  chickens.push({
    mesh: mesh,
    sex: b.sex,
    breed: breedName,
    tx: x,
    tz: z,
    timer: Math.random() * 5,
    eggTimer: 15 + Math.random() * 10
  });
}

// Başlangıç tavuğu
spawnChicken('Lohman Brown');

// --- Arayüz Güncelleme ---
function updateUI() {
  document.getElementById('money').textContent = Math.floor(state.money);
  document.getElementById('feed').textContent = Math.floor(state.feed);
  document.getElementById('eggs').textContent = state.eggs;
  document.getElementById('fem').textContent = chickens.filter(c => c.sex === 'f').length;
  document.getElementById('male').textContent = chickens.filter(c => c.sex === 'm').length;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.style.display = 'none', 2000);
}

// Market doldurma
const grid = document.getElementById('breedGrid');
Object.entries(breeds).forEach(([name, b]) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${b.sex === 'f' ? '🐔' : '🐓'} ${name}</h3><p>${b.desc}</p><button>${b.price} ₺ Satın Al</button>`;
  card.querySelector('button').onclick = () => {
    if (state.money >= b.price) {
      state.money -= b.price;
      spawnChicken(name);
      updateUI();
      toast(name + ' satın alındı!');
    } else {
      toast('Yetersiz bakiye!');
    }
  };
  grid.appendChild(card);
});

// Buton Olayları
document.getElementById('marketBtn').onclick = () => document.getElementById('market').style.display = 'block';
document.getElementById('closeMarketBtn').onclick = () => document.getElementById('market').style.display = 'none';
document.getElementById('buyFeedBtn').onclick = () => {
  if (state.money >= 25) {
    state.money -= 25;
    state.feed += 50;
    updateUI();
    toast('50 Yem alındı!');
  }
};
document.getElementById('feedBtn').onclick = () => {
  if (state.feed >= 10) {
    state.feed -= 10;
    updateUI();
    toast('🌾 Tavuklara yem saçıldı');
  }
};
document.getElementById('collectBtn').onclick = () => {
  if (state.eggs > 0) {
    const earned = state.eggs * 15;
    state.money += earned;
    toast(`🥚 Yumurtalar satıldı: +${earned} ₺`);
    state.eggs = 0;
    updateUI();
  } else {
    toast('Toplanacak yumurta yok!');
  }
};
document.getElementById('breedBtn').onclick = () => {
  const fCount = chickens.filter(c => c.sex === 'f').length;
  const mCount = chickens.filter(c => c.sex === 'm').length;
  if (fCount > 0 && mCount > 0) {
    spawnChicken('Lohman Brown');
    toast('❤️ Yeni bir tavuk doğdu!');
    updateUI();
  } else {
    toast('Çiftleştirme için en az 1 Horoz ve 1 Dişi lazım!');
  }
};

document.getElementById('startBtn').onclick = () => {
  const overlay = document.getElementById('startOverlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.style.display = 'none', 800);
  document.getElementById('hud').style.opacity = '1';
};

// --- Joystick Kontrolü ---
let joy = { x: 0, y: 0, active: false };
const js = document.getElementById('joystick'), st = document.getElementById('stick');

function handleMove(e) {
  const r = js.getBoundingClientRect();
  const x = e.clientX - r.left - 60;
  const y = e.clientY - r.top - 60;
  const dist = Math.min(45, Math.hypot(x, y));
  const angle = Math.atan2(y, x);
  joy.x = (Math.cos(angle) * dist) / 45;
  joy.y = (Math.sin(angle) * dist) / 45;
  st.style.left = (35 + joy.x * 30) + 'px';
  st.style.top = (35 + joy.y * 30) + 'px';
}

js.addEventListener('pointerdown', e => { joy.active = true; js.setPointerCapture(e.pointerId); handleMove(e); });
js.addEventListener('pointermove', e => { if (joy.active) handleMove(e); });
function endJoy() { joy.active = false; joy.x = 0; joy.y = 0; st.style.left = '33px'; st.style.top = '33px'; }
js.addEventListener('pointerup', endJoy);
js.addEventListener('pointercancel', endJoy);

// --- Oyun Döngüsü ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Oyuncu Hareketi
  if (joy.active) {
    playerGroup.position.x += joy.x * 6 * dt;
    playerGroup.position.z += joy.y * 6 * dt;
    playerGroup.rotation.y = Math.atan2(-joy.x, -joy.y);
    
    // Sınırlar
    playerGroup.position.x = Math.max(-18, Math.min(18, playerGroup.position.x));
    playerGroup.position.z = Math.max(-18, Math.min(18, playerGroup.position.z));
  }

  // Kamera Takibi
  camera.position.set(playerGroup.position.x, playerGroup.position.y + 10, playerGroup.position.z + 12);
  camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

  // Tavukların Gezinmesi ve Yumurtlaması
  chickens.forEach(c => {
    c.timer -= dt;
    if (c.timer <= 0) {
      c.tx = (Math.random() - 0.5) * 20;
      c.tz = (Math.random() - 0.5) * 20;
      c.timer = 4 + Math.random() * 5;
    }
    
    const dx = c.tx - c.mesh.position.x;
    const dz = c.tz - c.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.3) {
      c.mesh.position.x += (dx / dist) * 1.2 * dt;
      c.mesh.position.z += (dz / dist) * 1.2 * dt;
      c.mesh.rotation.y = Math.atan2(dx, dz);
    }

    if (c.sex === 'f') {
      c.eggTimer -= dt;
      if (c.eggTimer <= 0) {
        c.eggTimer = 20 + Math.random() * 10;
        state.eggs++;
        updateUI();
        toast('🥚 Yeni yumurta yapıldı!');
      }
    }
  });

  renderer.render(scene, camera);
}

// Ekran Yeniden Boyutlandırma
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateUI();
animate();
</script>
</body>
</html>
