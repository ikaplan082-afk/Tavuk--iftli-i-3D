<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tavuk Çiftliği 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c9ff;font-family:Arial,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:5}
.badge{background:#182235e8;color:#fff;border-radius:13px;padding:9px 12px;font-weight:800;font-size:14px}
#actions{position:fixed;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:8}
button{border:0;border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;background:#20884b;color:white;box-shadow:0 4px 12px #0005}
#joy{position:fixed;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:110px;height:110px;border:2px solid #fff9;border-radius:50%;background:#17223555;z-index:7}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:#fff;left:29px;top:29px}
#msg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#172235e8;color:#fff;padding:9px 13px;border-radius:12px;z-index:9;opacity:0;transition:.2s;font-weight:700}
#panel{display:none;position:fixed;z-index:20;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}
.card{width:min(520px,92vw);background:#fff;border-radius:22px;padding:18px;box-shadow:0 15px 45px #0007}
.card h2{margin:0 0 12px;color:#172235}
.row{display:flex;align-items:center;justify-content:space-between;background:#edf5ef;border-radius:14px;padding:12px;margin:8px 0}
.row b{display:block}.row span{color:#445}
.close{background:#333;width:100%;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="badge">💰 <span id="money">500</span> ₺</div>
 <div class="badge">🐔 Dişi: <span id="hens">1</span></div>
 <div class="badge">🐓 Horoz: <span id="roosters">0</span></div>
 <div class="badge">🥚 Yumurta: <span id="eggs">0</span></div>
 <div class="badge">🌾 Yem: <span id="feed">100</span></div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions">
 <button id="marketBtn">🛒 MARKET</button>
 <button id="breedBtn">❤️ ÇİFTLEŞTİR</button>
</div>
<div id="msg"></div>
<div id="panel"><div class="card">
<h2>🐔 Tavuk Çiftliği Marketi</h2>
<div class="row"><div><b>Dişi Tavuk</b><span>Sağlıklı yetişkin tavuk</span></div><button onclick="buy('hen')">80 ₺</button></div>
<div class="row"><div><b>Horoz</b><span>Damızlık erkek tavuk</span></div><button onclick="buy('rooster')">100 ₺</button></div>
<div class="row"><div><b>50 Yem</b><span>Yem stoğunu artırır</span></div><button onclick="buy('feed')">25 ₺</button></div>
<button class="close" onclick="closeMarket()">KAPAT</button>
</div></div>
<script>
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){alert('Bu cihaz WebGL desteklemiyor.');}
const V=`attribute vec3 p; attribute vec3 col; uniform mat4 m; varying vec3 v; void main(){gl_Position=m*vec4(p,1.0);v=col;}`;
const F=`precision mediump float; varying vec3 v; void main(){gl_FragColor=vec4(v,1.0);}`;
function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);
const pb=gl.createBuffer(),cb=gl.createBuffer(),locP=gl.getAttribLocation(pr,'p'),locC=gl.getAttribLocation(pr,'col'),locM=gl.getUniformLocation(pr,'m');
gl.enable(gl.DEPTH_TEST);
let verts=[],cols=[];
function box(x,y,z,sx,sy,sz,c){
 let x0=x-sx/2,x1=x+sx/2,y0=y,y1=y+sy,z0=z-sz/2,z1=z+sz/2;
 const f=[[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],[[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1]],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]]];
 for(const q of f){for(const tri of [[0,1,2],[0,2,3]])for(const i of tri){verts.push(...q[i]);cols.push(...c)}}
}
function roof(x,z,w,d,y,c){ // simple pyramid roof
 let a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],cc=[x+w/2,y,z+d/2],dd=[x-w/2,y,z+d/2],t=[x,y+d*.42,z];
 for(const q of [[a,b,t],[b,cc,t],[cc,dd,t],[dd,a,t]])for(const tri of [[0,1,2]])for(const i of tri){verts.push(...q[i]);cols.push(...c)}
}
function chicken(x,z,s,white=true){
 let c=white?[.92,.92,.86]:[.55,.18,.08], dark=white?[.72,.72,.67]:[.35,.08,.03];
 box(x,.45*s,z,.9*s,.7*s,.65*s,c); box(x+.42*s,.75*s,z,.32*s,.42*s,.32*s,c);
 box(x+.59*s,.75*s,z,.25*s,.18*s,.25*s,[.95,.65,.12]);
 box(x+.55*s,.98*s,z,.08*s,.18*s,.08*s,[.9,.1,.08]);
 box(x-.28*s,.05*s,z,.12*s,.45*s,.12*s,dark);box(x+.1*s,.05*s,z,.12*s,.45*s,.12*s,dark);
}
function tree(x,z){box(x,.9,z,.35,1.8,.35,[.38,.22,.08]);box(x,2,z,.9,1.2,.9,[.08,.45,.14]);box(x-.35,1.8,z,.7,.8,.7,[.1,.52,.18]);box(x+.35,1.8,z,.7,.8,.7,[.1,.52,.18]);}
function build(){
 verts=[];cols=[];
 // ground
 box(0,-.08,0,38,.16,30,[.28,.62,.22]);
 // road
 box(0,.01,5,38,.03,4,[.38,.34,.27]);
 // house + roof
 box(-9,0,-5,7,3.2,6,[.9,.72,.45]);roof(-9,-5,8,7,3.2,[.65,.12,.08]);
 // coop
 box(6,0,-5,7,3,6,[.72,.43,.2]);roof(6,-5,8,7,3,[.5,.25,.1]);
 // door/windows
 box(-9,1,-8.03,1.4,2.1,.08,[.2,.1,.06]);box(-6.8,1,-8.03,1.4,1.2,.08,[.2,.55,.75]);
 // fence around coop
 for(let x=1;x<=11;x+=1.5){box(x,.4,-8,.12,1.2,.12,[.9,.82,.62]);box(x,.4,-2,.12,1.2,.12,[.9,.82,.62])}
 box(6,.9,-8,10,.08,.08,[.9,.82,.62]);box(6,.9,-2,10,.08,.08,[.9,.82,.62]);
 for(let z=-8;z<=-2;z+=1.5){box(1,.4,z,.12,1.2,.12,[.9,.82,.62]);box(11,.4,z,.12,1.2,.12,[.9,.82,.62])}
 // trees
 [[-15,-7],[-15,4],[-12,9],[14,-7],[15,7],[9,10],[-3,-10]].forEach(a=>tree(...a));
 // initial animals
 chicken(3,-4,1,true);chicken(8,-5,1,true);chicken(5,-3,1,false);
}
build();
function perspective(fov,asp,n,f){let q=1/Math.tan(fov/2),nf=1/(n-f);return [q/asp,0,0,0,0,q,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0]}
function look(eye,at){let z=norm(sub(eye,at)),x=norm(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function mul(a,b){let r=Array(16);for(let c=0;c<4;c++)for(let r0=0;r0<4;r0++)r[c*4+r0]=a[r0]*b[c*4]+a[4+r0]*b[c*4+1]+a[8+r0]*b[c*4+2]+a[12+r0]*b[c*4+3];return r}
function sub(a,b){return a.map((v,i)=>v-b[i])}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){let n=Math.hypot(...a);return a.map(v=>v/n)}
let cam=[0,9,17], target=[0,0,0];
function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);resize();
function draw(){gl.clearColor(.52,.78,.98,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);gl.vertexAttribPointer(locP,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(locP);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(cols),gl.STATIC_DRAW);gl.vertexAttribPointer(locC,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(locC);gl.uniformMatrix4fv(locM,false,new Float32Array(mul(perspective(1.0,canvas.width/canvas.height,.1,100),look(cam,target))));gl.drawArrays(gl.TRIANGLES,0,verts.length/3);requestAnimationFrame(draw)}draw();
let money=500,hens=1,roosters=0,eggs=0,feed=100;
function update(){for(const [id,v] of [['money',money],['hens',hens],['roosters',roosters],['eggs',eggs],['feed',feed]])document.getElementById(id).textContent=v;localStorage.farm3d=JSON.stringify({money,hens,roosters,eggs,feed})}
try{let s=JSON.parse(localStorage.farm3d||'null');if(s){({money,hens,roosters,eggs,feed}=s)}}catch(e){} update();
function buy(t){if(t==='hen'&&money>=80){money-=80;hens++;toast('Dişi tavuk kümese geldi 🐔')}else if(t==='rooster'&&money>=100){money-=100;roosters++;toast('Horoz kümese geldi 🐓')}else if(t==='feed'&&money>=25){money-=25;feed+=50;toast('50 yem alındı 🌾')}else toast('Yeterli paran yok.');update()}
function breed(){if(hens>0&&roosters>0&&feed>=3){feed-=3;eggs++;toast('Yeni yumurta oluştu 🥚');update()}else toast('Çiftleşme için en az 1 dişi + 1 horoz + 3 yem gerekli.')}
function toast(t){let e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,2200)}
function closeMarket(){document.getElementById('panel').style.display='none'}
document.getElementById('marketBtn').onclick=()=>document.getElementById('panel').style.display='flex';
document.getElementById('breedBtn').onclick=breed;
let drag=false,sx=0,sy=0;
canvas.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-sx,dy=e.clientY-sy;sx=e.clientX;sy=e.clientY;cam[0]+=dx*.025;cam[2]+=dy*.025;});
canvas.addEventListener('pointerup',()=>drag=false);
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),jx=0,jy=0;
function joymove(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-55,y=e.clientY-r.top-55,d=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);jx=Math.cos(a)*d;jy=Math.sin(a)*d;knob.style.transform=`translate(${jx}px,${jy}px)`;cam[0]+=jx*.003;cam[2]+=jy*.003}
joy.addEventListener('pointermove',e=>{if(e.buttons)joymove(e)});joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joymove(e)});joy.addEventListener('pointerup',()=>{knob.style.transform='';jx=jy=0});
</script>
</body></html>
