<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Çiftlik Oyunu 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

#ui{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.panel{
    background:rgba(0,0,0,.65);
    color:white;
    padding:9px 13px;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    backdrop-filter:blur(5px);
}

#help{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    background:rgba(0,0,0,.55);
    padding:8px 14px;
    border-radius:12px;
    font-size:12px;
    text-align:center;
}
</style>
</head>

<body>

<div id="ui">
    <div class="panel">💰 Para: <span id="money">500</span></div>
    <div class="panel">🐔 Tavuk: <span id="chickenCount">6</span></div>
    <div class="panel">🐄 İnek: <span id="cowCount">3</span></div>
    <div class="panel">🥚 Yumurta: <span id="eggs">0</span></div>
    <div class="panel">🥛 Süt: <span id="milk">0</span></div>
</div>

<div id="help">
    Parmağınla sürükle: Kamerayı döndür • İki parmak: Yaklaştır/Uzaklaştır
</div>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

//////////////////////////////////////////////////////
// TEMEL THREE.JS
//////////////////////////////////////////////////////

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb,40,120);

const camera = new THREE.PerspectiveCamera(
    55,
    innerWidth/innerHeight,
    0.1,
    200
);

camera.position.set(0,22,28);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

//////////////////////////////////////////////////////
// IŞIK
//////////////////////////////////////////////////////

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x557744,
    2
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(-30,40,20);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);

//////////////////////////////////////////////////////
// ZEMİN
//////////////////////////////////////////////////////

const groundMaterial = new THREE.MeshStandardMaterial({
    color:0x63a64b,
    roughness:1
});

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    groundMaterial
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

//////////////////////////////////////////////////////
// YARDIMCI FONKSİYONLAR
//////////////////////////////////////////////////////

function box(w,h,d,color){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        })
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    return mesh;
}

function cylinder(r1,r2,h,color){

    const mesh=new THREE.Mesh(
        new THREE.CylinderGeometry(r1,r2,h,12),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        })
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    return mesh;
}

//////////////////////////////////////////////////////
// EV
//////////////////////////////////////////////////////

const house=new THREE.Group();

const houseBody=box(8,4,6,0xd6a06b);
houseBody.position.y=2;

house.add(houseBody);

const roof=new THREE.Mesh(
    new THREE.ConeGeometry(5.5,3.5,4),
    new THREE.MeshStandardMaterial({
        color:0x8b3e2f
    })
);

roof.rotation.y=Math.PI/4;
roof.position.y=5.5;

roof.castShadow=true;

house.add(roof);

const door=box(1.5,2.5,.2,0x4a2918);
door.position.set(0,1.25,3.05);

house.add(door);

scene.add(house);

//////////////////////////////////////////////////////
// AHIR
//////////////////////////////////////////////////////

const barn=new THREE.Group();

const barnBody=box(9,4.5,7,0x9e4035);
barnBody.position.y=2.25;

barn.add(barnBody);

const barnRoof=new THREE.Mesh(
    new THREE.ConeGeometry(6.2,4,4),
    new THREE.MeshStandardMaterial({
        color:0x54251f
    })
);

barnRoof.rotation.y=Math.PI/4;
barnRoof.position.y=6;

barn.add(barnRoof);

const barnDoor=box(3,3,.25,0x4a281d);
barnDoor.position.set(0,1.5,3.6);

barn.add(barnDoor);

barn.position.set(-20,0,-8);

scene.add(barn);

//////////////////////////////////////////////////////
// KÜMES
//////////////////////////////////////////////////////

const coop=new THREE.Group();

const coopBody=box(5,2.5,4,0xc47a42);
coopBody.position.y=1.25;

coop.add(coopBody);

const coopRoof=new THREE.Mesh(
    new THREE.ConeGeometry(3.8,2.5,4),
    new THREE.MeshStandardMaterial({
        color:0x703526
    })
);

coopRoof.rotation.y=Math.PI/4;
coopRoof.position.y=3.7;

coop.add(coopRoof);

coop.position.set(16,0,-11);

scene.add(coop);

//////////////////////////////////////////////////////
// FOLLLUKLAR
//////////////////////////////////////////////////////

for(let i=0;i<4;i++){

    const nest=cylinder(
        .6,
        .7,
        .25,
        0x8b5a2b
    );

    nest.position.set(
        14+i*1.2,
        .35,
        -8
    );

    scene.add(nest);
}

//////////////////////////////////////////////////////
// ÇİT
//////////////////////////////////////////////////////

function fence(x,z,rotation){

    const post=box(.25,1.5,.25,0x70452a);

    post.position.set(x,.75,z);

    scene.add(post);

    const rail=box(
        rotation==="x" ? 4 : .25,
        .18,
        rotation==="x" ? .18 : 4,
        0x8b5a2b
    );

    rail.position.set(x,.9,z);

    scene.add(rail);
}

for(let x=-30;x<=30;x+=4){

    fence(x,-25,"x");
    fence(x,25,"x");
}

for(let z=-21;z<=21;z+=4){

    fence(-30,z,"z");
    fence(30,z,"z");
}

//////////////////////////////////////////////////////
// AĞAÇ
//////////////////////////////////////////////////////

function tree(x,z){

    const t=new THREE.Group();

    const trunk=cylinder(
        .45,
        .6,
        3,
        0x6b3e22
    );

    trunk.position.y=1.5;

    t.add(trunk);

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(2.2,12,10),
        new THREE.MeshStandardMaterial({
            color:0x2f7d32
        })
    );

    leaves.position.y=4;

    leaves.castShadow=true;

    t.add(leaves);

    t.position.set(x,0,z);

    scene.add(t);
}

tree(-25,-18);
tree(-25,15);
tree(25,15);
tree(25,-20);
tree(-10,20);
tree(10,20);

//////////////////////////////////////////////////////
// TAVUK
//////////////////////////////////////////////////////

const chickens=[];

function createChicken(){

    const chicken=new THREE.Group();

    // gövde
    const body=new THREE.Mesh(
        new THREE.SphereGeometry(.65,16,12),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    body.scale.set(1.2,.9,1);
    body.position.y=.8;

    body.castShadow=true;

    chicken.add(body);

    // kafa
    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.38,16,12),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    head.position.set(.45,1.25,0);

    head.castShadow=true;

    chicken.add(head);

    // gaga
    const beak=new THREE.Mesh(
        new THREE.ConeGeometry(.12,.35,8),
        new THREE.MeshStandardMaterial({
            color:0xffa500
        })
    );

    beak.rotation.z=-Math.PI/2;
    beak.position.set(.8,1.23,0);

    chicken.add(beak);

    // ibik
    const comb=cylinder(
        .08,
        .08,
        .18,
        0xff2222
    );

    comb.rotation.z=Math.PI/2;
    comb.position.set(.45,1.62,0);

    chicken.add(comb);

    // bacaklar
    for(let x of [-.25,.25]){

        const leg=cylinder(
            .06,
            .06,
            .45,
            0xffa500
        );

        leg.position.set(x,.3,0);

        chicken.add(leg);
    }

    chicken.userData={
        type:"chicken",
        target:null,
        speed:.8+Math.random()*.5,
        timer:0
    };

    chicken.position.set(
        -10+Math.random()*20,
        0,
        -5+Math.random()*20
    );

    scene.add(chicken);

    chickens.push(chicken);
}

for(let i=0;i<6;i++){
    createChicken();
}

//////////////////////////////////////////////////////
// İNEK
//////////////////////////////////////////////////////

const cows=[];

function createCow(){

    const cow=new THREE.Group();

    const body=box(
        2.2,
        1.5,
        3.2,
        0xffffff
    );

    body.position.y=1.4;
    body.castShadow=true;

    cow.add(body);

    // siyah lekeler
    const spot=box(
        .6,
        .5,
        .15,
        0x222222
    );

    spot.position.set(
        0,
        1.6,
        1.63
    );

    cow.add(spot);

    // kafa
    const head=box(
        1.5,
        1.3,
        1.5,
        0xffffff
    );

    head.position.set(
        0,
        1.8,
        2
    );

    head.castShadow=true;

    cow.add(head);

    // kulaklar
    for(let x of [-.8,.8]){

        const ear=new THREE.Mesh(
            new THREE.SphereGeometry(.3,10,8),
            new THREE.MeshStandardMaterial({
                color:0xdddddd
            })
        );

        ear.position.set(
            x,
            2.1,
            2
        );

        cow.add(ear);
    }

    // boynuzlar
    for(let x of [-.5,.5]){

        const horn=cylinder(
            .08,
            .18,
            .5,
            0xd9c39a
        );

        horn.position.set(
            x,
            2.65,
            2
        );

        cow.add(horn);
    }

    // bacaklar
    for(let x of [-.7,.7]){
        for(let z of [-1,.9]){

            const leg=cylinder(
                .16,
                .2,
                1.4,
                0xeeeeee
            );

            leg.position.set(
                x,
                .7,
                z
            );

            cow.add(leg);
        }
    }

    cow.userData={
        type:"cow",
        target:null,
        speed:.35+Math.random()*.25,
        timer:0
    };

    cow.position.set(
        -18+Math.random()*12,
        0,
        -2+Math.random()*15
    );

    scene.add(cow);

    cows.push(cow);
}

for(let i=0;i<3;i++){
    createCow();
}

//////////////////////////////////////////////////////
// HAYVAN HAREKET SİSTEMİ
//////////////////////////////////////////////////////

function chooseTarget(animal){

    let x,z;

    if(animal.userData.type==="chicken"){

        x=-22+Math.random()*44;
        z=-20+Math.random()*40;

    }else{

        x=-24+Math.random()*25;
        z=-18+Math.random()*35;
    }

    animal.userData.target=new THREE.Vector3(
        x,
        0,
        z
    );

    animal.userData.timer=2+Math.random()*5;
}

function moveAnimal(animal,delta){

    if(!animal.userData.target){
        chooseTarget(animal);
        return;
    }

    const target=animal.userData.target;

    const dx=target.x-animal.position.x;
    const dz=target.z-animal.position.z;

    const distance=Math.sqrt(dx*dx+dz*dz);

    if(distance<.5){

        animal.userData.timer-=delta;

        if(animal.userData.timer<=0){
            chooseTarget(animal);
        }

        return;
    }

    const angle=Math.atan2(dx,dz);

    animal.rotation.y=angle;

    animal.position.x += Math.sin(angle)
        *animal.userData.speed
        *delta;

    animal.position.z += Math.cos(angle)
        *animal.userData.speed
        *delta;
}

//////////////////////////////////////////////////////
// TARLA
//////////////////////////////////////////////////////

const field=box(
    18,
    .25,
    12,
    0x8b5a2b
);

field.position.set(
    4,
    .12,
    13
);

scene.add(field);

for(let x=-3;x<=11;x+=2){

    for(let z=9;z<=17;z+=2){

        const crop=cylinder(
            .04,
            .12,
            .5,
            0x2f8f35
        );

        crop.position.set(
            x,
            .5,
            z
        );

        scene.add(crop);
    }
}

//////////////////////////////////////////////////////
// TAŞLAR
//////////////////////////////////////////////////////

for(let i=0;i<25;i++){

    const stone=new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            .15+Math.random()*.25,
            0
        ),
        new THREE.MeshStandardMaterial({
            color:0x777777
        })
    );

    stone.position.set(
        -28+Math.random()*56,
        .15,
        -23+Math.random()*46
    );

    stone.castShadow=true;

    scene.add(stone);
}

//////////////////////////////////////////////////////
// KAMERA KONTROLÜ
//////////////////////////////////////////////////////

let rotating=false;
let lastX=0;
let lastY=0;

let cameraAngle=0;
let cameraDistance=32;
let cameraHeight=22;

canvas.addEventListener(
    "pointerdown",
    e=>{
        rotating=true;
        lastX=e.clientX;
        lastY=e.clientY;
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(!rotating)return;

        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;

        cameraAngle-=dx*.006;

        cameraHeight+=dy*.04;

        cameraHeight=Math.max(
            10,
            Math.min(40,cameraHeight)
        );

        lastX=e.clientX;
        lastY=e.clientY;
    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{
        rotating=false;
    }
);

canvas.addEventListener(
    "pointercancel",
    ()=>{
        rotating=false;
    }
);

canvas.addEventListener(
    "wheel",
    e=>{
        cameraDistance+=e.deltaY*.03;

        cameraDistance=Math.max(
            12,
            Math.min(60,cameraDistance)
        );
    }
);

//////////////////////////////////////////////////////
// OYUN ZAMANI
//////////////////////////////////////////////////////

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    const delta=Math.min(
        (now-lastTime)/1000,
        .05
    );

    lastTime=now;

    //////////////////////////////////////////////////
    // HAYVANLAR
    //////////////////////////////////////////////////

    chickens.forEach(
        chicken=>moveAnimal(chicken,delta)
    );

    cows.forEach(
        cow=>moveAnimal(cow,delta)
    );

    //////////////////////////////////////////////////
    // KAMERA
    //////////////////////////////////////////////////

    camera.position.x=
        Math.sin(cameraAngle)*cameraDistance;

    camera.position.z=
        Math.cos(cameraAngle)*cameraDistance;

    camera.position.y=
        cameraHeight;

    camera.lookAt(
        0,
        0,
        0
    );

    renderer.render(
        scene,
        camera
    );
}

animate();

//////////////////////////////////////////////////////
// EKRAN BOYUTU
//////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
