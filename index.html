<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Çiftlik Oyunu 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#ui{
    position:fixed;
    top:12px;
    left:12px;
    z-index:20;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.panel{
    background:rgba(0,0,0,.65);
    color:white;
    padding:9px 12px;
    border-radius:12px;
    font-weight:bold;
    font-size:14px;
}

#joystick{
    position:fixed;
    left:25px;
    bottom:30px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.5);
    z-index:30;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:50%;
    top:50%;
    margin-left:-29px;
    margin-top:-29px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    border:3px solid rgba(0,0,0,.2);
}

#collect{
    display:none;
    position:fixed;
    right:25px;
    bottom:45px;
    z-index:30;
    width:115px;
    height:60px;
    border:none;
    border-radius:18px;
    background:#e9b949;
    color:white;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

#message{
    position:fixed;
    left:50%;
    top:100px;
    transform:translateX(-50%);
    z-index:25;
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 18px;
    border-radius:15px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

#help{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    background:rgba(0,0,0,.45);
    padding:6px 10px;
    border-radius:10px;
    font-size:11px;
}
</style>
</head>

<body>

<div id="ui">
    <div class="panel">💰 <span id="money">500</span></div>
    <div class="panel">🐔 <span id="chickenCount">6</span></div>
    <div class="panel">🐄 <span id="cowCount">3</span></div>
    <div class="panel">🥚 <span id="eggs">0</span></div>
</div>

<div id="message"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="collect">🥚 TOPLA</button>

<div id="help">
    Joystick ile hareket et
</div>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =================================================
   TEMEL
================================================= */

const canvas=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

scene.fog=new THREE.Fog(
    0x87ceeb,
    45,
    120
);

const camera=new THREE.PerspectiveCamera(
    55,
    innerWidth/innerHeight,
    .1,
    200
);

const renderer=new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


/* =================================================
   IŞIK
================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x557744,
        2
    )
);

const sun=new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(-30,40,20);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


/* =================================================
   ZEMİN
================================================= */

const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({
        color:0x63a64b,
        roughness:1
    })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =================================================
   YARDIMCI
================================================= */

function box(w,h,d,color){

    const m=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        })
    );

    m.castShadow=true;
    m.receiveShadow=true;

    return m;
}

function cylinder(r1,r2,h,color){

    const m=new THREE.Mesh(
        new THREE.CylinderGeometry(
            r1,r2,h,12
        ),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:.9
        })
    );

    m.castShadow=true;
    m.receiveShadow=true;

    return m;
}


/* =================================================
   EV
================================================= */

const house=new THREE.Group();

const hb=box(8,4,6,0xd6a06b);
hb.position.y=2;
house.add(hb);

const hr=new THREE.Mesh(
    new THREE.ConeGeometry(5.5,3.5,4),
    new THREE.MeshStandardMaterial({
        color:0x8b3e2f
    })
);

hr.rotation.y=Math.PI/4;
hr.position.y=5.5;
house.add(hr);

const hd=box(1.5,2.5,.2,0x4a2918);
hd.position.set(0,1.25,3.05);
house.add(hd);

scene.add(house);


/* =================================================
   AHIR
================================================= */

const barn=new THREE.Group();

const bb=box(9,4.5,7,0x9e4035);
bb.position.y=2.25;
barn.add(bb);

const br=new THREE.Mesh(
    new THREE.ConeGeometry(6.2,4,4),
    new THREE.MeshStandardMaterial({
        color:0x54251f
    })
);

br.rotation.y=Math.PI/4;
br.position.y=6;
barn.add(br);

const bd=box(3,3,.25,0x4a281d);
bd.position.set(0,1.5,3.6);
barn.add(bd);

barn.position.set(-20,0,-8);

scene.add(barn);


/* =================================================
   KÜMES
================================================= */

const coop=new THREE.Group();

const cb=box(5,2.5,4,0xc47a42);
cb.position.y=1.25;
coop.add(cb);

const cr=new THREE.Mesh(
    new THREE.ConeGeometry(3.8,2.5,4),
    new THREE.MeshStandardMaterial({
        color:0x703526
    })
);

cr.rotation.y=Math.PI/4;
cr.position.y=3.7;
coop.add(cr);

coop.position.set(16,0,-11);

scene.add(coop);


/* =================================================
   AĞAÇ
================================================= */

function tree(x,z){

    const t=new THREE.Group();

    const trunk=cylinder(
        .45,.6,3,0x6b3e22
    );

    trunk.position.y=1.5;
    t.add(trunk);

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(
            2.2,12,10
        ),
        new THREE.MeshStandardMaterial({
            color:0x2f7d32
        })
    );

    leaves.position.y=4;
    leaves.castShadow=true;

    t.add(leaves);

    t.position.set(x,0,z);

    scene.add(t);
}

tree(-25,-18);
tree(-25,15);
tree(25,15);
tree(25,-20);
tree(-10,20);
tree(10,20);


/* =================================================
   ÇİT
================================================= */

function fence(x,z,vertical){

    const post=box(
        .25,1.5,.25,0x70452a
    );

    post.position.set(
        x,.75,z
    );

    scene.add(post);

    const rail=box(
        vertical ? .18 : 4,
        .18,
        vertical ? 4 : .18,
        0x8b5a2b
    );

    rail.position.set(
        x,.9,z
    );

    scene.add(rail);
}

for(let x=-30;x<=30;x+=4){

    fence(x,-25,false);
    fence(x,25,false);
}

for(let z=-21;z<=21;z+=4){

    fence(-30,z,true);
    fence(30,z,true);
}


/* =================================================
   TAVUK
================================================= */

const chickens=[];

function createChicken(){

    const chicken=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,16,12
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    body.scale.set(1.2,.9,1);
    body.position.y=.8;
    body.castShadow=true;

    chicken.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .38,16,12
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );

    head.position.set(
        .45,1.25,0
    );

    chicken.add(head);

    const beak=new THREE.Mesh(
        new THREE.ConeGeometry(
            .12,.35,8
        ),
        new THREE.MeshStandardMaterial({
            color:0xffa500
        })
    );

    beak.rotation.z=-Math.PI/2;
    beak.position.set(
        .8,1.23,0
    );

    chicken.add(beak);

    const comb=cylinder(
        .08,.08,.18,0xff2222
    );

    comb.rotation.z=Math.PI/2;
    comb.position.set(
        .45,1.62,0
    );

    chicken.add(comb);

    for(let x of [-.25,.25]){

        const leg=cylinder(
            .06,.06,.45,0xffa500
        );

        leg.position.set(
            x,.3,0
        );

        chicken.add(leg);
    }

    chicken.userData={
        type:"chicken",
        target:null,
        speed:.7+Math.random()*.4,
        timer:0,
        eggTimer:8+Math.random()*8
    };

    chicken.position.set(
        -10+Math.random()*20,
        0,
        -5+Math.random()*20
    );

    scene.add(chicken);

    chickens.push(chicken);
}

for(let i=0;i<6;i++){
    createChicken();
}


/* =================================================
   İNEK
================================================= */

const cows=[];

function createCow(){

    const cow=new THREE.Group();

    const body=box(
        2.2,1.5,3.2,0xffffff
    );

    body.position.y=1.4;
    cow.add(body);

    const spot=box(
        .6,.5,.15,0x222222
    );

    spot.position.set(
        0,1.6,1.63
    );

    cow.add(spot);

    const head=box(
        1.5,1.3,1.5,0xffffff
    );

    head.position.set(
        0,1.8,2
    );

    cow.add(head);

    for(let x of [-.7,.7]){

        for(let z of [-1,.9]){

            const leg=cylinder(
                .16,.2,1.4,0xeeeeee
            );

            leg.position.set(
                x,.7,z
            );

            cow.add(leg);
        }
    }

    cow.userData={
        type:"cow",
        target:null,
        speed:.3+Math.random()*.2,
        timer:0
    };

    cow.position.set(
        -18+Math.random()*12,
        0,
        -2+Math.random()*15
    );

    scene.add(cow);
    cows.push(cow);
}

for(let i=0;i<3;i++){
    createCow();
}


/* =================================================
   YUMURTALAR
================================================= */

const eggs=[];

let eggCount=0;

function createEgg(position){

    const egg=new THREE.Mesh(
        new THREE.SphereGeometry(
            .22,16,12
        ),
        new THREE.MeshStandardMaterial({
            color:0xfff4dc
        })
    );

    egg.scale.y=1.35;

    egg.position.copy(position);
    egg.position.y=.25;

    egg.castShadow=true;

    egg.userData={
        type:"egg"
    };

    scene.add(egg);

    eggs.push(egg);

    eggCount++;

    document.getElementById(
        "eggs"
    ).textContent=eggCount;
}


/* =================================================
   HAYVAN HEDEF
================================================= */

function chooseTarget(animal){

    let x,z;

    if(animal.userData.type==="chicken"){

        x=-22+Math.random()*44;
        z=-20+Math.random()*40;

    }else{

        x=-24+Math.random()*25;
        z=-18+Math.random()*35;
    }

    animal.userData.target=
        new THREE.Vector3(x,0,z);

    animal.userData.timer=
        2+Math.random()*5;
}

function moveAnimal(animal,delta){

    if(!animal.userData.target){

        chooseTarget(animal);
        return;
    }

    const target=
        animal.userData.target;

    const dx=
        target.x-animal.position.x;

    const dz=
        target.z-animal.position.z;

    const distance=
        Math.sqrt(dx*dx+dz*dz);

    if(distance<.5){

        animal.userData.timer-=delta;

        if(animal.userData.timer<=0){

            chooseTarget(animal);
        }

        return;
    }

    const angle=Math.atan2(dx,dz);

    animal.rotation.y=angle;

    animal.position.x +=
        Math.sin(angle)*
        animal.userData.speed*
        delta;

    animal.position.z +=
        Math.cos(angle)*
        animal.userData.speed*
        delta;
}


/* =================================================
   OYUNCU
================================================= */

const player=new THREE.Group();

const playerBody=box(
    1,1.8,.8,0x2474c6
);

playerBody.position.y=1.2;
player.add(playerBody);

const playerHead=new THREE.Mesh(
    new THREE.SphereGeometry(
        .45,16,12
    ),
    new THREE.MeshStandardMaterial({
        color:0xf0b48a
    })
);

playerHead.position.y=2.45;

player.add(playerHead);


/* bacaklar */

for(let x of [-.25,.25]){

    const leg=box(
        .25,1,.3,0x222222
    );

    leg.position.set(
        x,.5,0
    );

    player.add(leg);
}

player.position.set(
    0,0,5
);

scene.add(player);


/* =================================================
   JOYSTICK
================================================= */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyX=0;
let joyY=0;

let joystickActive=false;

const maxJoy=45;

function updateJoystick(e){

    const rect=
        joystick.getBoundingClientRect();

    let x=
        e.clientX-
        (rect.left+rect.width/2);

    let y=
        e.clientY-
        (rect.top+rect.height/2);

    const distance=
        Math.sqrt(x*x+y*y);

    if(distance>maxJoy){

        x=x/distance*maxJoy;
        y=y/distance*maxJoy;
    }

    joyX=x/maxJoy;
    joyY=y/maxJoy;

    stick.style.transform=
        `translate(${x}px,${y}px)`;
}

joystick.addEventListener(
    "pointerdown",
    e=>{
        joystickActive=true;
        joystick.setPointerCapture(e.pointerId);
        updateJoystick(e);
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(joystickActive){
            updateJoystick(e);
        }
    }
);

joystick.addEventListener(
    "pointerup",
    ()=>{
        joystickActive=false;
        joyX=0;
        joyY=0;

        stick.style.transform=
            "translate(0,0)";
    }
);


/* =================================================
   OYUNCU HAREKET
================================================= */

function movePlayer(delta){

    const strength=
        Math.sqrt(
            joyX*joyX+
            joyY*joyY
        );

    if(strength<.05)return;

    const speed=7;

    player.position.x +=
        joyX*speed*delta;

    player.position.z +=
        joyY*speed*delta;

    player.position.x=
        Math.max(
            -27,
            Math.min(27,player.position.x)
        );

    player.position.z=
        Math.max(
            -22,
            Math.min(22,player.position.z)
        );

    player.rotation.y=
        Math.atan2(
            joyX,
            joyY
        );
}


/* =================================================
   YAKIN YUMURTA
================================================= */

let nearbyEgg=null;

const collectButton=
    document.getElementById("collect");

function checkEgg(){

    nearbyEgg=null;

    let nearest=2.2;

    for(const egg of eggs){

        if(!egg.parent)return;

        const d=
            player.position.distanceTo(
                egg.position
            );

        if(d<nearest){

            nearest=d;
            nearbyEgg=egg;
        }
    }

    if(nearbyEgg){

        collectButton.style.display=
            "block";

    }else{

        collectButton.style.display=
            "none";
    }
}


/* =================================================
   YUMURTA TOPLA
================================================= */

function collectEgg(){

    if(!nearbyEgg)return;

    scene.remove(nearbyEgg);

    const index=
        eggs.indexOf(nearbyEgg);

    if(index!==-1){

        eggs.splice(index,1);
    }

    eggCount--;

    document.getElementById(
        "eggs"
    ).textContent=eggCount;

    let money=
        Number(
            document.getElementById(
                "money"
            ).textContent
        );

    money+=10;

    document.getElementById(
        "money"
    ).textContent=money;

    showMessage(
        "🥚 Yumurta topladın! +10 💰"
    );

    nearbyEgg=null;

    collectButton.style.display=
        "none";
}

collectButton.addEventListener(
    "pointerdown",
    collectEgg
);


/* =================================================
   MESAJ
================================================= */

let messageTimer;

function showMessage(text){

    const message=
        document.getElementById(
            "message"
        );

    message.textContent=text;
    message.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=setTimeout(
        ()=>{
            message.style.opacity=0;
        },
        1600
    );
}


/* =================================================
   KAMERA
================================================= */

const cameraOffset=
    new THREE.Vector3(
        0,15,18
    );

function updateCamera(){

    const target=
        player.position.clone();

    const desired=
        player.position.clone()
        .add(cameraOffset);

    camera.position.lerp(
        desired,
        .08
    );

    camera.lookAt(
        target.x,
        target.y,
        target.z
    );
}


/* =================================================
   TAVUK YUMURTLAMA
================================================= */

function updateChickenEggs(delta){

    for(const chicken of chickens){

        chicken.userData.eggTimer-=delta;

        if(
            chicken.userData.eggTimer<=0
        ){

            const p=
                chicken.position.clone();

            p.x+=
                (Math.random()-.5)*.8;

            p.z+=
                (Math.random()-.5)*.8;

            createEgg(p);

            chicken.userData.eggTimer=
                12+Math.random()*15;

            showMessage(
                "🐔 Bir tavuk yumurtladı! 🥚"
            );
        }
    }
}


/* =================================================
   ANİMASYON
================================================= */

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    const delta=
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime=now;

    movePlayer(delta);

    chickens.forEach(
        c=>moveAnimal(c,delta)
    );

    cows.forEach(
        c=>moveAnimal(c,delta)
    );

    updateChickenEggs(delta);

    checkEgg();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =================================================
   EKRAN
================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
