<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rustik Çiftlik 3D - Tavuk, İnek ve Koyun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a2b1e;font-family:Segoe UI,Tahoma,sans-serif;color:#3d2310}
#game-container{width:100%;height:100%;position:absolute;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .8s}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap}
.stat{background:rgba(247,245,237,.94);border:2px solid #6e4726;border-radius:12px;padding:7px 10px;font-weight:bold;font-size:12px;backdrop-filter:blur(5px);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.actions{position:absolute;right:10px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;pointer-events:auto}
button{border:2px solid #3d2310;border-radius:12px;padding:12px 15px;background:#c19a6b;color:#3d2310;font-size:13px;font-weight:bold;box-shadow:0 5px 0 #6e4726,0 5px 15px rgba(0,0,0,.35);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #6e4726}
#marketBtn{background:#e0a96d} #sellBtn{background:#2e7d32;color:white}
.rounds{position:absolute;left:145px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.round{width:62px;height:62px;border-radius:50%;padding:3px;background:rgba(247,245,237,.93);font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.round span{font-size:20px}
#joystick{position:absolute;left:16px;bottom:max(18px,env(safe-area-inset-bottom));width:115px;height:115px;border-radius:50%;background:rgba(110,71,38,.3);border:3px solid #6e4726;pointer-events:auto}
#stick{position:absolute;width:52px;height:52px;border-radius:50%;left:31px;top:31px;background:rgba(247,245,237,.95);border:2px solid #3d2310}
.panel{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,700px);max-height:85vh;overflow:auto;background:#f7f5ed;border:3px solid #6e4726;border-radius:20px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.panel h2{margin:0 0 14px;color:#6e4726;border-bottom:2px solid #c8d3c4;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.card{background:white;border:2px solid #c8d3c4;border-radius:14px;padding:11px}
.card-preview{height:85px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:43px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:15px}.card p{font-size:11px;margin:4px 0 9px;color:#5c4033}
.card button{width:100%;padding:9px;background:#4a7a4c;color:white;border:0;box-shadow:0 3px 0 #2e512f}
.close{width:100%;margin-top:12px;background:#5c4033;color:white;border:0}
.toast{display:none;position:fixed;z-index:30;top:78px;left:50%;transform:translateX(-50%);background:rgba(61,35,16,.95);color:#f7f5ed;padding:11px 16px;border-radius:12px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center}
#startOverlay{position:fixed;inset:0;background:rgba(26,43,30,.88);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
#startOverlay h1{font-size:32px;color:#c19a6b;text-align:center;text-shadow:0 4px 12px #000;margin:0 15px 10px}
#startOverlay p{font-size:14px;color:#ddd;text-align:center;margin:0 20px 25px}
#startBtn{font-size:18px;padding:15px 38px;background:#44a059;color:white;border:0;border-radius:35px}
@media(max-width:620px){.stat{font-size:9px;padding:5px 7px}.rounds{left:135px}.round{width:55px;height:55px}.round span{font-size:17px}.actions button{padding:9px 10px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="game-container"></div>

<div id="startOverlay">
<h1>🌿 RUSTİK BAHÇELİ ÇİFTLİK 3D</h1>
<p>🐔 Tavuk • 🐄 İnek • 🐑 Koyun<br>Yumurta, süt ve yün üret!</p>
<button id="startBtn">OYUNA BAŞLA</button>
</div>

<div id="hud">
<div class="top">
<div class="stat">💰 <span id="money">500</span> ₺</div>
<div class="stat">🐔 <span id="chickenCount">5</span></div>
<div class="stat">🐄 <span id="cowCount">0</span></div>
<div class="stat">🐑 <span id="sheepCount">0</span></div>
<div class="stat">🥚 <span id="eggs">0</span></div>
<div class="stat">🥛 <span id="milk">0</span></div>
<div class="stat">🧶 <span id="wool">0</span></div>
<div class="stat">🌾 <span id="feed">100</span></div>
</div>
<div class="actions">
<button id="sellBtn">💰 ÜRÜNLERİ SAT</button>
<button id="marketBtn">🛒 HAYVAN PAZARI</button>
</div>
<div class="rounds">
<button class="round" id="feedBtn"><span>🌾</span>YEM VER</button>
<button class="round" id="collectBtn"><span>📦</span>TOPLA</button>
</div>
<div id="joystick"><div id="stick"></div></div>
</div>

<div id="market" class="panel">
<h2>🛒 Çiftlik Hayvanları Pazarı</h2>
<div class="grid" id="marketGrid"></div>
<div class="card" style="margin-top:12px;background:#f0e6d2">
<div class="card-preview">🌾</div><h3>50 KG Çiftlik Yemi</h3>
<p>Tüm hayvanların üretiminde kullanılır.</p>
<button id="buyFeed">25 ₺ Satın Al</button>
</div>
<button class="close" id="closeMarket">MARKETİ KAPAT</button>
</div>
<div id="toast" class="toast"></div>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa7d8f5);
scene.fog=new THREE.FogExp2(0xa7d8f5,.012);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game-container').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff1e0,.75));
const sun=new THREE.DirectionalLight(0xffe0b3,1.4);sun.position.set(30,45,30);sun.castShadow=true;sun.shadow.mapSize.width=2048;sun.shadow.mapSize.height=2048;scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(65,65),new THREE.MeshStandardMaterial({color:0x4d8038,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const wood=new THREE.MeshStandardMaterial({color:0x6e4726,roughness:.8});
function fence(x,z,r){const g=new THREE.Group();for(const px of [-1.5,1.5]){let p=new THREE.Mesh(new THREE.BoxGeometry(.2,1.2,.2),wood);p.position.set(px,.6,0);p.castShadow=true;g.add(p)}for(const y of [.45,.85]){let q=new THREE.Mesh(new THREE.BoxGeometry(3.2,.12,.08),wood);q.position.y=y;g.add(q)}g.position.set(x,0,z);g.rotation.y=r;scene.add(g)}
for(let i=-21;i<=21;i+=3){fence(i,-24,0);fence(i,24,0);fence(-24,i,Math.PI/2);fence(24,i,Math.PI/2)}

function building(x,z,w,d,h,color,roofColor){
 const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color,roughness:.8});
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.y=h/2;b.castShadow=true;g.add(b);
 const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,h*.65,4),new THREE.MeshStandardMaterial({color:roofColor}));r.position.y=h+h*.3;r.rotation.y=Math.PI/4;g.add(r);
 g.position.set(x,0,z);scene.add(g);
}
building(-11,-11,4.8,3.8,3,0x6e4726,0x8b2500);
building(0,12,7,5,3,0x76502d,0x6b301e);
building(-12,12,7,5,3,0x76502d,0x6b301e);

const player=new THREE.Group();
let torso=new THREE.Mesh(new THREE.CylinderGeometry(.35,.3,1.2,8),new THREE.MeshStandardMaterial({color:0x3d5a80}));torso.position.y=1.2;player.add(torso);
let head=new THREE.Mesh(new THREE.SphereGeometry(.24,12,12),new THREE.MeshStandardMaterial({color:0xffdbac}));head.position.y=1.95;player.add(head);scene.add(player);

const state={money:500,feed:100,eggs:0,milk:0,wool:0};
let animals=[],groundProducts=[];

function part(g,geo,mat,pos,scale){
 let m=new THREE.Mesh(geo,mat);m.position.set(...pos);if(scale)m.scale.set(...scale);m.castShadow=true;g.add(m);return m;
}
function animalModel(type){
 const g=new THREE.Group();
 if(type==='cow'){
  const bodyMat=new THREE.MeshStandardMaterial({color:0xf2eee3,roughness:.85});
  const spot=new THREE.MeshStandardMaterial({color:0x4b3526,roughness:.8});
  part(g,new THREE.BoxGeometry(1.45,.8,.72),bodyMat,[0,.85,0]);
  part(g,new THREE.BoxGeometry(.55,.62,.58),bodyMat,[.78,1.05,.12]);
  for(const s of [-1,1]){part(g,new THREE.CylinderGeometry(.055,.07,.65,8),spot,[s*.48,.35,.23]);part(g,new THREE.CylinderGeometry(.055,.07,.65,8),spot,[s*.48,.35,-.23]);}
  part(g,new THREE.SphereGeometry(.18,10,10),spot,[.9,1.08,.35]);
  part(g,new THREE.ConeGeometry(.09,.35,8),spot,[.86,1.5,.2]);
  part(g,new THREE.ConeGeometry(.09,.35,8),spot,[.65,1.5,.2]);
  part(g,new THREE.SphereGeometry(.12,10,10),spot,[1.05,.92,.25]);
 }else if(type==='sheep'){
  const woolMat=new THREE.MeshStandardMaterial({color:0xf5f2e9,roughness:1});
  const dark=new THREE.MeshStandardMaterial({color:0x33302c,roughness:.9});
  for(const p of [[0,.82,0],[-.45,.86,0],[.45,.86,0],[0,.95,.45],[0,.95,-.45]])part(g,new THREE.SphereGeometry(.48,12,10),woolMat,p,[1.2,.9,.85]);
  part(g,new THREE.SphereGeometry(.28,12,10),dark,[.65,1.03,.08],[.9,1.05,.9]);
  for(const s of [-1,1]){part(g,new THREE.CylinderGeometry(.045,.06,.55,7),dark,[s*.32,.35,.2]);part(g,new THREE.CylinderGeometry(.045,.06,.55,7),dark,[s*.32,.35,-.2]);}
 }else{
  return createChicken(type);
 }
 return g;
}
function createChicken(type){
 const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:type==='rooster'?0xca3000:0xac5325,roughness:.7});
 const red=new THREE.MeshStandardMaterial({color:0xd11a1a});
 part(g,new THREE.SphereGeometry(.42,14,12),mat,[0,.48,0],[1,.9,1.3]);
 part(g,new THREE.SphereGeometry(.19,12,10),mat,[0,.92,.32]);
 part(g,new THREE.ConeGeometry(.06,.18,4),new THREE.MeshStandardMaterial({color:0xf59e0b}),[0,.92,.5]);
 if(type==='rooster'){for(let i=0;i<3;i++)part(g,new THREE.BoxGeometry(.05,.18,.14),red,[0,1.08+i*.02,.3-i*.06])}
 for(const s of [-1,1])part(g,new THREE.CylinderGeometry(.025,.025,.3,6),new THREE.MeshStandardMaterial({color:0xd97706}),[s*.14,.15,.02]);
 return g;
}
const prices={chicken:90,rooster:160,cow:600,sheep:450};
const names={chicken:'Lohman Tavuk',rooster:'Kızıl Horoz',cow:'Süt İneği',sheep:'Yün Koyunu'};

function spawn(type,x=null,z=null,age=0){
 const mesh=animalModel(type);x=x??(Math.random()-.5)*20;z=z??(Math.random()- .5)*20;mesh.position.set(x,0,z);scene.add(mesh);
 animals.push({type,mesh,x,z,tx:x,tz:z,timer:Math.random()*3,age,prod: type==='chicken'?15:type==='cow'?28:35});
}
function productMesh(type,x,z){
 const colors={egg:0xf7e6d2,milk:0xffffff,wool:0xe8e3d8};
 const geo=type==='egg'?new THREE.SphereGeometry(.13,10,10):new THREE.SphereGeometry(.18,10,10);
 const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:colors[type],roughness:.8}));
 m.position.set(x,.12,z);if(type==='egg')m.scale.set(1,1.35,1);scene.add(m);groundProducts.push({type,mesh:m});
}
function saveGame(){
 localStorage.setItem('rustik_ciftlik_save_v2',JSON.stringify({
  state,animals:animals.map(a=>({type:a.type,x:a.mesh.position.x,z:a.mesh.position.z,age:a.age,prod:a.prod})),
  products:groundProducts.map(p=>({type:p.type,x:p.mesh.position.x,z:p.mesh.position.z}))
 }));
}
function clearAnimals(){animals.forEach(a=>scene.remove(a.mesh));animals=[];groundProducts.forEach(p=>scene.remove(p.mesh));groundProducts=[]}
function loadGame(){
 const raw=localStorage.getItem('rustik_ciftlik_save_v2');if(!raw)return false;
 try{const d=JSON.parse(raw);Object.assign(state,d.state||{});
 clearAnimals();
 (d.animals||[]).forEach(a=>{spawn(a.type,a.x,a.z,a.age);animals[animals.length-1].prod=a.prod??animals[animals.length-1].prod});
 (d.products||[]).forEach(p=>productMesh(p.type,p.x,p.z));return animals.length>0}catch(e){console.log(e);return false}
}
if(!loadGame()){spawn('rooster');spawn('rooster');spawn('chicken');spawn('chicken');spawn('chicken')}

function ui(){
 money.textContent=Math.floor(state.money);feed.textContent=Math.floor(state.feed);
 eggs.textContent=state.eggs;milk.textContent=state.milk;wool.textContent=state.wool;
 chickenCount.textContent=animals.filter(a=>a.type==='chicken'||a.type==='rooster').length;
 cowCount.textContent=animals.filter(a=>a.type==='cow').length;
 sheepCount.textContent=animals.filter(a=>a.type==='sheep').length;
}
function toast(s){const t=document.getElementById('toast');t.innerHTML=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2800)}

const marketGrid=document.getElementById('marketGrid');
[['chicken','🐔','Tavuk','Yumurta üretir.'],['rooster','🐓','Horoz','Kümes sürüsünü destekler.'],['cow','🐄','Süt İneği','Süt üretir.'],['sheep','🐑','Koyun','Yün üretir.']].forEach(([type,emoji,title,desc])=>{
 const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="card-preview">${emoji}</div><h3>${title}</h3><p>${desc}</p><button>${prices[type]} ₺ Satın Al</button>`;
 c.querySelector('button').onclick=()=>{if(state.money<prices[type])return toast('Yetersiz bakiye!');state.money-=prices[type];spawn(type);ui();saveGame();toast(`${emoji} <b>${names[type]}</b> çiftliğe katıldı!`)};marketGrid.appendChild(c);
});
marketBtn.onclick=()=>market.style.display='block';closeMarket.onclick=()=>market.style.display='none';
buyFeed.onclick=()=>{if(state.money>=25){state.money-=25;state.feed+=50;ui();saveGame();toast('🌾 50 KG yem eklendi!')}else toast('Yetersiz bakiye!')};
feedBtn.onclick=()=>{if(state.feed>=10){state.feed-=10;ui();saveGame();toast('🌾 Hayvanlara yem verildi!')}else toast('Yem bitti!')};

collectBtn.onclick=()=>{
 let n=groundProducts.length;if(!n)return toast('📦 Toplanacak ürün yok!');
 groundProducts.forEach(p=>{state[p.type==='egg'?'eggs':p.type==='milk'?'milk':'wool']++;scene.remove(p.mesh)});
 groundProducts=[];ui();saveGame();toast(`📦 ${n} ürün toplandı!`);
};
sellBtn.onclick=()=>{
 const total=state.eggs*15+state.milk*35+state.wool*45;
 if(!total)return toast('Satılacak ürün yok!');
 state.money+=total;state.eggs=0;state.milk=0;state.wool=0;ui();saveGame();toast(`💰 Ürünler satıldı: <b>+${total} ₺</b>`);
};
startBtn.onclick=()=>{startOverlay.style.opacity=0;setTimeout(()=>startOverlay.style.display='none',800);hud.style.opacity=1};

let joy={x:0,y:0,active:false};const js=document.getElementById('joystick'),st=document.getElementById('stick');
function moveJoy(e){const r=js.getBoundingClientRect(),x=e.clientX-r.left-57.5,y=e.clientY-r.top-57.5,d=Math.min(43,Math.hypot(x,y)),a=Math.atan2(y,x);joy.x=Math.cos(a)*d/43;joy.y=Math.sin(a)*d/43;st.style.left=31+joy.x*28+'px';st.style.top=31+joy.y*28+'px'}
js.addEventListener('pointerdown',e=>{joy.active=true;js.setPointerCapture(e.pointerId);moveJoy(e)});js.addEventListener('pointermove',e=>{if(joy.active)moveJoy(e)});['pointerup','pointercancel'].forEach(x=>js.addEventListener(x,()=>{joy.active=false;joy.x=joy.y=0;st.style.left='31px';st.style.top='31px'}));

const clock=new THREE.Clock();let at=0;
function animate(){
 requestAnimationFrame(animate);const dt=clock.getDelta();at+=dt*8;
 if(joy.active){player.position.x+=joy.x*7*dt;player.position.z+=joy.y*7*dt;player.rotation.y=Math.atan2(-joy.x,-joy.y)}
 player.position.x=Math.max(-23,Math.min(23,player.position.x));player.position.z=Math.max(-23,Math.min(23,player.position.z));
 camera.position.set(player.position.x+1,player.position.y+10,player.position.z+13);camera.lookAt(player.position.x,1,player.position.z);
 animals.forEach(a=>{
  a.timer-=dt;if(a.timer<=0){a.tx=(Math.random()-.5)*22;a.tz=(Math.random()-.5)*22;a.timer=3+Math.random()*5}
  let dx=a.tx-a.mesh.position.x,dz=a.tz-a.mesh.position.z,d=Math.hypot(dx,dz);
  if(d>.4){let speed=a.type==='chicken'||a.type==='rooster'?1.5:0.8;a.mesh.position.x+=dx/d*speed*dt;a.mesh.position.z+=dz/d*speed*dt;a.mesh.rotation.y=Math.atan2(dx,dz);a.mesh.position.y=Math.abs(Math.sin(at))*0.05}
  a.prod-=dt;
  if(a.prod<=0){
   a.prod=a.type==='chicken'?20+Math.random()*12:a.type==='cow'?35+Math.random()*15:45+Math.random()*15;
   const p=a.type==='chicken'?'egg':a.type==='cow'?'milk':'wool';productMesh(p,a.mesh.position.x,a.mesh.position.z);
   toast(p==='egg'?'🥚 Taze yumurta!':p==='milk'?'🥛 İnek süt verdi!':'🧶 Koyun yün verdi!');saveGame();
  }
 });
 renderer.render(scene,camera);
}
addEventListener('beforeunload',saveGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});setInterval(saveGame,5000);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
ui();animate();
</script>
</body>
</html>
